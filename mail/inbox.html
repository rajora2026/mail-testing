<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#07162b"/>
<title>Inbox · BetterGrowth Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --navy-950:#050f1f; --navy-900:#07162b; --navy-800:#0b2038; --navy-700:#143252;
    --gold:#d9a62e; --gold-deep:#b8841a; --gold-soft:#f1d899;
    --paper:#f4f5f8; --white:#fff; --ink:#0b1b30; --muted:#5a6a7f;
    --line:#dde2ea; --ok:#17653a; --ok-bg:#e3f4ea; --bad:#9b1c1c; --bad-bg:#fde4e4;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100svh;
       -webkit-font-smoothing:antialiased;line-height:1.45}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  [hidden]{display:none!important}
  button{font-family:inherit}
  svg{flex:none}

  /* Top bar */
  .topbar{background:linear-gradient(90deg,var(--navy-950) 0%,var(--navy-700) 100%);color:#e9eef6;
    padding:.6rem 1.25rem;padding-top:max(.6rem,env(safe-area-inset-top));
    display:flex;align-items:center;gap:.9rem;position:sticky;top:0;z-index:40;
    border-bottom:2px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .brandmark{font-family:var(--serif);font-weight:700;font-size:1.3rem;color:var(--gold);display:flex;align-items:center;gap:.55rem;white-space:nowrap}
  .brandmark .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:.95rem;color:#fff}
  .admin-badge{background:var(--gold);color:var(--navy-900);padding:.15rem .5rem;border-radius:5px;font-family:var(--sans);font-size:.62rem;font-weight:700;letter-spacing:.08em}
  .nav-links{display:flex;gap:.25rem;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:.25rem}
  .nav-links a{color:#cbd5e1;text-decoration:none;padding:.42rem .85rem;border-radius:8px;font-size:.84rem;font-weight:500;
    display:inline-flex;align-items:center;gap:.4rem;transition:background .15s,color .15s}
  .nav-links a:hover{background:rgba(255,255,255,.1);color:#fff}
  .nav-links a.active{background:var(--gold);color:var(--navy-900);font-weight:600}
  .nbadge{background:var(--gold);color:var(--navy-900);font-size:.65rem;font-weight:700;min-width:18px;padding:.02rem .38rem;border-radius:99px;text-align:center;line-height:1.5}
  .nav-links a.active .nbadge{background:var(--navy-900);color:var(--gold)}
  .spacer{flex:1}
  .tools{display:flex;gap:.5rem}
  .tbtn{background:var(--gold);color:var(--navy-900);border:0;min-height:38px;padding:0 .95rem;border-radius:9px;font-weight:600;cursor:pointer;
    font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem;transition:background .15s}
  .tbtn:hover{background:#e4b343}
  .tbtn.ghost{background:transparent;color:#e9eef6;border:1px solid rgba(255,255,255,.22)}
  .tbtn.ghost:hover{background:rgba(255,255,255,.09)}
  .tbtn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bottom-nav{display:none}

  .wrap{max-width:900px;margin:auto;padding:1.25rem}
  .page-head{margin:.2rem 0 1rem}
  .page-head h1{font-family:var(--serif);font-weight:700;font-size:2rem;margin:0;line-height:1.05}
  .page-head p{color:var(--muted);margin:.3rem 0 0;font-size:.92rem}

  /* Controls */
  .controls{display:grid;grid-template-columns:1fr auto;gap:.6rem;margin-bottom:.7rem}
  .search{position:relative}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#8896a8;pointer-events:none}
  .search input{width:100%;height:46px;padding:0 .9rem 0 2.6rem;font:inherit;font-size:16px;background:var(--white);
    border:1.5px solid var(--line);border-radius:12px;color:var(--ink)}
  select{height:46px;padding:0 2.2rem 0 .85rem;font:inherit;font-size:16px;color:var(--ink);background-color:var(--white);
    border:1.5px solid var(--line);border-radius:12px;appearance:none;-webkit-appearance:none;max-width:210px;text-overflow:ellipsis;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235a6a7f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right .75rem center}
  .search input:focus,select:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 4px rgba(217,166,46,.22)}
  .chips{display:flex;gap:.4rem;overflow-x:auto;margin:0 -.25rem 1rem;padding:.1rem .25rem;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--white);border:1.5px solid var(--line);border-radius:999px;min-height:40px;padding:0 1rem;
    font-size:.85rem;font-weight:500;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:.45rem;transition:all .15s}
  .chip:hover{background:#eceef2}
  .chip.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
  .chip .n{background:var(--paper);color:var(--muted);font-size:.7rem;font-weight:700;padding:.02rem .45rem;border-radius:99px}
  .chip.active .n{background:rgba(255,255,255,.18);color:#fff}

  /* List */
  .list{display:flex;flex-direction:column;gap:.55rem}
  .mail{display:flex;align-items:flex-start;gap:.85rem;background:var(--white);border:1.5px solid var(--line);border-radius:14px;
    padding:.9rem 1rem;text-decoration:none;color:var(--ink);position:relative;transition:border-color .15s,box-shadow .15s,transform .08s}
  .mail:hover{border-color:#c3cbd7;box-shadow:0 8px 20px -12px rgba(11,27,48,.25)}
  .mail:active{transform:scale(.995)}
  .mail.unread{background:#fffdf6;border-left:4px solid var(--gold)}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--navy-800);color:var(--gold);display:grid;place-items:center;flex:none;
    font-family:var(--serif);font-weight:700;font-size:1.2rem}
  .mail.unread .avatar{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--navy-900)}
  .mail .body{flex:1;min-width:0}
  .mail .row1{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;margin-bottom:.1rem}
  .mail .from{font-weight:500;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .mail.unread .from{font-weight:700}
  .mail .time{font-size:.74rem;color:var(--muted);flex:none;white-space:nowrap}
  .mail.unread .time{color:var(--gold-deep);font-weight:600}
  .mail .subject{font-size:.92rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mail.unread .subject{font-weight:600}
  .mail .preview{font-size:.82rem;color:var(--muted);margin-top:.15rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .rtag{display:inline-block;background:rgba(217,166,46,.16);color:var(--gold-deep);padding:.12rem .55rem;border-radius:6px;font-size:.7rem;font-weight:600;margin-top:.4rem}
  .udot{width:9px;height:9px;border-radius:50%;background:var(--gold);position:absolute;top:.95rem;right:.95rem}
  .mail.unread .time{padding-right:1rem}

  .skel{height:92px;border-radius:14px;background:linear-gradient(90deg,#eceff4 25%,#f6f7fa 50%,#eceff4 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted);background:var(--white);border-radius:16px;border:1.5px dashed var(--line)}
  .empty svg{color:#b4bfcd;margin-bottom:.7rem}
  .empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:.3rem}
  .empty .btn{margin-top:1rem}
  .btn{background:var(--gold);color:var(--navy-900);border:0;min-height:44px;padding:0 1.15rem;border-radius:11px;font-weight:600;cursor:pointer;
    font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;text-decoration:none}
  .btn:hover{background:#e4b343}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{background:var(--paper)}
  .more{display:flex;justify-content:center;margin-top:.9rem}

  .toast-wrap{position:fixed;top:1rem;right:1rem;z-index:300;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
  .toast{background:var(--navy-800);color:#e9eef6;padding:.75rem 1rem;border-radius:11px;font-size:.88rem;border-left:4px solid var(--gold);
    box-shadow:0 10px 28px rgba(0,0,0,.3);animation:slidein .25s ease-out;max-width:320px;transition:opacity .3s}
  .toast.ok{border-left-color:#4ade80}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

  .credit{text-align:center;color:var(--muted);font-size:.85rem;padding:.5rem 1rem 1.5rem}
  .credit a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:1px}
  .credit a:hover{color:var(--gold-deep)}

  /* Mobile */
  @media (max-width:860px){
    .topbar{padding:.55rem .9rem;padding-top:max(.55rem,env(safe-area-inset-top));gap:.5rem}
    .brandmark{font-size:1.15rem}
    .nav-links{display:none}
    .tools{margin-left:auto}
    .tbtn{width:40px;padding:0;justify-content:center}
    .tbtn .lbl{display:none}
    .wrap{padding:.85rem}
    .page-head h1{font-size:1.7rem}
    .controls{grid-template-columns:1fr}
    select{max-width:none;width:100%}
    .mail{padding:.8rem .85rem;gap:.7rem;border-radius:13px}
    .avatar{width:40px;height:40px}
    .bottom-nav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:50;
      background:rgba(7,22,43,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(217,166,46,.35);
      padding:.3rem .4rem;padding-bottom:max(.3rem,env(safe-area-inset-bottom))}
    .bottom-nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:52px;color:#9fb0c6;
      text-decoration:none;font-size:.68rem;font-weight:500;border-radius:11px;letter-spacing:.02em}
    .bottom-nav a.active{color:var(--gold);background:rgba(217,166,46,.12)}
    .bottom-nav .nbadge{position:absolute;top:3px;left:calc(50% + 6px)}
    body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
    .toast-wrap{top:auto;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));left:1rem;right:1rem;align-items:center}
    .toast{max-width:none;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brandmark"><span class="mark">bg</span>BetterGrowth <span class="admin-badge" id="adminBadge" hidden>ADMIN</span></div>
  <nav class="nav-links" id="topNav" aria-label="Main"></nav>
  <div class="spacer"></div>
  <div class="tools">
    <button class="tbtn ghost" id="refreshBtn" onclick="load()" aria-label="Refresh">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg>
      <span class="lbl">Refresh</span>
    </button>
    <button class="tbtn" onclick="logout()" aria-label="Sign out">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      <span class="lbl">Sign out</span>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>Inbox</h1>
    <p id="subtitle">Loading…</p>
  </div>

  <div class="controls">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search sender, subject or message…" aria-label="Search inbox"/>
    </label>
    <select id="recipientFilter" aria-label="Filter by recipient" hidden><option value="">All recipients</option></select>
  </div>

  <div class="chips" id="filterChips" role="tablist" aria-label="Filter by status">
    <button class="chip active" data-filter="all">All <span class="n" id="nAll">0</span></button>
    <button class="chip" data-filter="unread">Unread <span class="n" id="nUnread">0</span></button>
    <button class="chip" data-filter="read">Read <span class="n" id="nRead">0</span></button>
  </div>

  <div class="list" id="list" aria-live="polite"></div>
</div>

<footer class="credit">
  Made by <a href="https://rajvardhansingh.in/" target="_blank" rel="noopener noreferrer">Rajvardhan Singh</a>
</footer>

<nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>
const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
const ADMIN_EMAIL = "admin@bettergrowthsolutions.com";
const $ = id => document.getElementById(id);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const authHeaders = () => ({ Authorization: "Bearer " + store.get("token") });
const USER = (store.get("user") || "").toLowerCase();
const IS_ADMIN = USER === ADMIN_EMAIL;

function esc(s = "") {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("toastWrap").appendChild(el);
  setTimeout(() => el.style.opacity = "0", 2200);
  setTimeout(() => el.remove(), 2600);
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso), diff = Date.now() - d;
  if (diff < 60_000) return "just now";
  if (diff < 3600_000) return Math.floor(diff / 60000) + "m ago";
  if (diff < 86400_000) return Math.floor(diff / 3600000) + "h ago";
  if (diff < 604800_000) return Math.floor(diff / 86400000) + "d ago";
  return d.toLocaleDateString(undefined, { dateStyle: "medium" });
}

/* Navigation (differs for admin vs normal users) */
const IC = {
  home:  '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  send:  '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>',
  sent:  '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>',
  inbox: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/>',
  logs:  '<path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/>'
};
const NAV = IS_ADMIN
  ? [["admin","Admin","home"],["send","Send","send"],["sent","Sent","sent"],["inbox","Inbox","inbox"],["admin_logs","Logs","logs"]]
  : [["dashboard","Dashboard","home"],["send","Send","send"],["sent","Sent","sent"],["inbox","Inbox","inbox"]];

function buildNav(unread = 0) {
  const link = (size, sw) => ([href, label, icon]) => {
    const active = href === "inbox";
    const badge = href === "inbox" && unread ? `<span class="nbadge">${unread > 99 ? "99+" : unread}</span>` : "";
    return `<a href="${href}" ${active ? 'class="active" aria-current="page"' : ""}>
      <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[icon]}</svg>${label}${badge}</a>`;
  };
  $("topNav").innerHTML = NAV.map(link(15, 2)).join("");
  $("bottomNav").innerHTML = NAV.map(link(22, 1.9)).join("");
  $("bottomNav").style.gridTemplateColumns = `repeat(${NAV.length},1fr)`;
}

/* Data */
let ALL_EMAILS = [];
let FILTER = "all", QUERY = "", RECIPIENT = "", SHOWN = 100;
const PAGE = 100;

const skeleton = () => Array.from({ length: 4 }, () => '<div class="skel"></div>').join("");

async function load() {
  const box = $("list");
  const btn = $("refreshBtn");
  btn.classList.add("spin");
  box.innerHTML = skeleton();
  try {
    const url = IS_ADMIN ? FN + "?action=admin_inbound_list" : FN + "?action=inbound_list";
    const r = await fetch(url, { headers: authHeaders() });
    if (r.status === 401) return logout();
    if (!r.ok) throw new Error("HTTP " + r.status);

    const data = await r.json();
    ALL_EMAILS = Array.isArray(data) ? data : [];
    SHOWN = PAGE;

    $("subtitle").textContent = IS_ADMIN
      ? `All received emails · ${ALL_EMAILS.length} total`
      : `Emails to ${USER} · ${ALL_EMAILS.length} total`;
    buildRecipients();
    render();
  } catch (err) {
    $("subtitle").textContent = "Could not load";
    box.innerHTML = `<div class="empty">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
      <b>Could not load your inbox</b>
      ${esc(err.message === "Failed to fetch" ? "Can't reach the server. Check your connection." : err.message)}
      <div><button class="btn" onclick="load()">Try again</button></div>
    </div>`;
  } finally {
    btn.classList.remove("spin");
  }
}

function buildRecipients() {
  const sel = $("recipientFilter");
  if (!IS_ADMIN) { sel.hidden = true; return; }
  const counts = {};
  ALL_EMAILS.forEach(e => { const r = e.recipient_email || "unknown"; counts[r] = (counts[r] || 0) + 1; });
  sel.innerHTML = `<option value="">All recipients</option>` +
    Object.keys(counts).sort().map(r => `<option value="${esc(r)}">${esc(r.split("@")[0])} (${counts[r]})</option>`).join("");
  if (RECIPIENT && !counts[RECIPIENT]) RECIPIENT = "";
  sel.value = RECIPIENT;
  sel.hidden = false;
}

function matches(e) {
  if (RECIPIENT && e.recipient_email !== RECIPIENT) return false;
  const q = QUERY.toLowerCase();
  if (!q) return true;
  return (e.from_email || "").toLowerCase().includes(q) ||
         (e.subject || "").toLowerCase().includes(q) ||
         (e.body || "").toLowerCase().includes(q) ||
         (e.recipient_email || "").toLowerCase().includes(q);
}

function render() {
  const box = $("list");
  const base = ALL_EMAILS.filter(matches);           // search + recipient applied; counts reflect this
  const unreadN = base.filter(e => e.status === "unread").length;
  const readN   = base.filter(e => e.status === "read").length;
  $("nAll").textContent = base.length;
  $("nUnread").textContent = unreadN;
  $("nRead").textContent = readN;
  buildNav(ALL_EMAILS.filter(e => e.status === "unread").length);

  let filtered = base;
  if (FILTER === "unread") filtered = base.filter(e => e.status === "unread");
  if (FILTER === "read")   filtered = base.filter(e => e.status === "read");

  if (!filtered.length) {
    const searching = QUERY || RECIPIENT;
    box.innerHTML = `<div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
      <b>${searching ? "No emails match" : FILTER === "all" ? "Your inbox is empty" : "No " + FILTER + " emails"}</b>
      ${searching ? "Try a different search or clear the filters."
        : FILTER === "all" ? "Emails sent to your address will appear here."
        : "Try a different filter."}
    </div>`;
    return;
  }

  let html = filtered.slice(0, SHOWN).map(e => {
    const unread = e.status === "unread";
    const fromName = (e.from_email || "?").split("@")[0];
    const recipient = (e.recipient_email || "").split("@")[0];
    const preview = (e.body || "").replace(/\s+/g, " ").trim().slice(0, 200);
    return `
      <a class="mail ${unread ? "unread" : "read"}" href="inbox-view?id=${encodeURIComponent(e.id)}">
        <div class="avatar" aria-hidden="true">${esc((fromName[0] || "?").toUpperCase())}</div>
        <div class="body">
          <div class="row1">
            <span class="from">${esc(fromName)}</span>
            <span class="time">${esc(fmtTime(e.created_at))}</span>
          </div>
          <div class="subject">${esc(e.subject || "(no subject)")}</div>
          ${preview ? `<div class="preview">${esc(preview)}</div>` : ""}
          ${IS_ADMIN ? `<span class="rtag">→ ${esc(recipient)}@</span>` : ""}
        </div>
        ${unread ? '<span class="udot" title="Unread"></span>' : ""}
      </a>`;
  }).join("");

  if (filtered.length > SHOWN) {
    html += `<div class="more"><button class="btn ghost" id="moreBtn">Show more (${filtered.length - SHOWN} left)</button></div>`;
  }
  box.innerHTML = html;
  const mb = $("moreBtn");
  if (mb) mb.addEventListener("click", () => { SHOWN += PAGE; render(); });
}

$("filterChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  FILTER = chip.dataset.filter;
  SHOWN = PAGE;
  render();
});
$("search").addEventListener("input", e => { QUERY = e.target.value.trim(); SHOWN = PAGE; render(); });
$("recipientFilter").addEventListener("change", e => { RECIPIENT = e.target.value; SHOWN = PAGE; render(); });

/* Sign out: also tells the server so the session shows up in the admin logs */
async function logout() {
  const token = store.get("token");
  const sessionId = store.get("bg_session_id");
  const loginAt = Number(store.get("bg_login_at") || 0);
  const duration = loginAt ? Math.round((Date.now() - loginAt) / 1000) : null;
  try {
    if (token && sessionId) {
      await fetch(FN + "?action=log_logout", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ session_id: sessionId, duration_sec: duration })
      });
    }
  } catch {}
  ["token","user","isAdmin","bg_session_id","bg_login_at","bg_sid","bg_captcha_ok","bg_admin_captcha_ok"].forEach(store.del);
  location.href = "/";
}

/* Boot */
if (!store.get("token")) { location.href = "/"; }
else {
  $("adminBadge").hidden = !IS_ADMIN;
  buildNav(0);
  load();
}
</script>
</body>
