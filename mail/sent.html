<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#07162b"/>
<title>Sent · BetterGrowth Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --navy-950:#050f1f; --navy-900:#07162b; --navy-800:#0b2038; --navy-700:#143252;
    --gold:#d9a62e; --gold-deep:#b8841a; --gold-soft:#f1d899;
    --steel:#6b8cae; --steel-ink:#3a5a7a;
    --paper:#f4f5f8; --white:#fff; --ink:#0b1b30; --muted:#5a6a7f;
    --line:#dde2ea; --ok:#17653a; --ok-bg:#e3f4ea; --warn:#7a5410; --warn-bg:#fdf1d6; --bad:#9b1c1c; --bad-bg:#fde4e4;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100svh;
       -webkit-font-smoothing:antialiased;line-height:1.45}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  [hidden]{display:none!important}
  button{font-family:inherit}
  svg{flex:none}

  /* Top bar */
  .topbar{background:linear-gradient(90deg,var(--navy-950) 0%,var(--navy-700) 100%);color:#e9eef6;
    padding:.6rem 1.25rem;padding-top:max(.6rem,env(safe-area-inset-top));
    display:flex;align-items:center;gap:.9rem;position:sticky;top:0;z-index:40;
    border-bottom:2px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .brandmark{font-family:var(--serif);font-weight:700;font-size:1.3rem;color:var(--gold);display:flex;align-items:center;gap:.55rem;white-space:nowrap}
  .brandmark .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:.95rem;color:#fff}
  .admin-badge{background:var(--gold);color:var(--navy-900);padding:.15rem .5rem;border-radius:5px;font-family:var(--sans);font-size:.62rem;font-weight:700;letter-spacing:.08em}
  .nav-links{display:flex;gap:.25rem;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:.25rem}
  .nav-links a{color:#cbd5e1;text-decoration:none;padding:.42rem .85rem;border-radius:8px;font-size:.84rem;font-weight:500;
    display:inline-flex;align-items:center;gap:.4rem;transition:background .15s,color .15s}
  .nav-links a:hover{background:rgba(255,255,255,.1);color:#fff}
  .nav-links a.active{background:var(--gold);color:var(--navy-900);font-weight:600}
  .spacer{flex:1}
  .tools{display:flex;gap:.5rem}
  .tbtn{background:var(--gold);color:var(--navy-900);border:0;min-height:38px;padding:0 .95rem;border-radius:9px;font-weight:600;cursor:pointer;
    font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem;transition:background .15s}
  .tbtn:hover{background:#e4b343}
  .tbtn.ghost{background:transparent;color:#e9eef6;border:1px solid rgba(255,255,255,.22)}
  .tbtn.ghost:hover{background:rgba(255,255,255,.09)}
  .tbtn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bottom-nav{display:none}

  .wrap{max-width:900px;margin:auto;padding:1.25rem}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin:.2rem 0 1rem}
  .page-head h1{font-family:var(--serif);font-weight:700;font-size:2rem;margin:0;line-height:1.05}
  .page-head p{color:var(--muted);margin:.3rem 0 0;font-size:.92rem}

  /* Controls */
  .search{position:relative;margin-bottom:.7rem;display:block}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#8896a8;pointer-events:none}
  .search input{width:100%;height:46px;padding:0 .9rem 0 2.6rem;font:inherit;font-size:16px;background:var(--white);
    border:1.5px solid var(--line);border-radius:12px;color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 4px rgba(217,166,46,.22)}
  .chips{display:flex;gap:.4rem;overflow-x:auto;margin:0 -.25rem .6rem;padding:.1rem .25rem;scrollbar-width:none;align-items:center}
  .chips::-webkit-scrollbar{display:none}
  .chips .lab{flex:none;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-right:.2rem}
  .chip{flex:none;background:var(--white);border:1.5px solid var(--line);border-radius:999px;min-height:40px;padding:0 1rem;
    font-size:.85rem;font-weight:500;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:.45rem;transition:all .15s;white-space:nowrap}
  .chip:hover{background:#eceef2}
  .chip.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
  .chip .n{background:var(--gold);color:var(--navy-900);font-size:.68rem;font-weight:700;padding:.02rem .45rem;border-radius:99px;min-width:20px;text-align:center}
  .chip.active .n{background:rgba(255,255,255,.22);color:#fff}
  .result-info{font-size:.8rem;color:var(--muted);margin:.2rem .2rem .3rem;min-height:1.2em}

  /* List */
  .list{display:flex;flex-direction:column;gap:.55rem}
  .mail{display:flex;align-items:flex-start;gap:.85rem;background:var(--white);border:1.5px solid var(--line);border-left:5px solid var(--steel);
    border-radius:14px;padding:.9rem 1rem;text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .08s}
  .mail.failed{border-left-color:#c0392b}
  .mail:hover{border-color:#c3cbd7;box-shadow:0 8px 20px -12px rgba(11,27,48,.25)}
  .mail.failed:hover{border-left-color:#c0392b}
  .mail:hover{border-left-color:var(--steel)}
  .mail:active{transform:scale(.995)}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--navy-800);color:var(--gold);display:grid;place-items:center;flex:none;
    font-family:var(--serif);font-weight:700;font-size:1.15rem}
  .mail .body{flex:1;min-width:0}
  .mail .row1{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;margin-bottom:.1rem}
  .mail .to{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .mail .time{font-size:.74rem;color:var(--muted);flex:none;white-space:nowrap}
  .mail .subject{font-size:.95rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mail .preview{font-size:.82rem;color:var(--muted);margin-top:.15rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem;align-items:center}
  .tag{display:inline-flex;align-items:center;gap:.3rem;padding:.14rem .6rem;border-radius:99px;font-size:.72rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag.cc{background:var(--paper);color:var(--muted)}
  .tag.att{background:rgba(217,166,46,.16);color:var(--gold-deep)}
  .tag.from{background:rgba(107,140,174,.14);color:var(--steel-ink)}
  .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}
  .tag.bad{background:var(--bad-bg);color:var(--bad)}
  .tag.ok::before,.tag.warn::before,.tag.bad::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  .skel{height:96px;border-radius:14px;background:linear-gradient(90deg,#eceff4 25%,#f6f7fa 50%,#eceff4 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted);background:var(--white);border-radius:16px;border:1.5px dashed var(--line)}
  .empty svg{color:#b4bfcd;margin-bottom:.7rem}
  .empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:.3rem}
  .empty .btn{margin-top:1rem}
  .btn{background:var(--gold);color:var(--navy-900);border:0;min-height:44px;padding:0 1.15rem;border-radius:11px;font-weight:600;cursor:pointer;
    font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;text-decoration:none}
  .btn:hover{background:#e4b343}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{background:var(--paper)}
  .more{display:flex;justify-content:center;margin-top:.9rem}

  .toast-wrap{position:fixed;top:1rem;right:1rem;z-index:300;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
  .toast{background:var(--navy-800);color:#e9eef6;padding:.75rem 1rem;border-radius:11px;font-size:.88rem;border-left:4px solid var(--gold);
    box-shadow:0 10px 28px rgba(0,0,0,.3);animation:slidein .25s ease-out;max-width:320px;transition:opacity .3s}
  .toast.ok{border-left-color:#4ade80}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

  .credit{text-align:center;color:var(--muted);font-size:.85rem;padding:.5rem 1rem 1.5rem}
  .credit a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:1px}
  .credit a:hover{color:var(--gold-deep)}

  /* Mobile */
  @media (max-width:860px){
    .topbar{padding:.55rem .9rem;padding-top:max(.55rem,env(safe-area-inset-top));gap:.5rem}
    .brandmark{font-size:1.15rem}
    .nav-links{display:none}
    .tools{margin-left:auto}
    .tbtn{width:40px;padding:0;justify-content:center}
    .tbtn .lbl{display:none}
    .wrap{padding:.85rem}
    .page-head h1{font-size:1.7rem}
    .page-head .btn{width:100%}
    .mail{padding:.8rem .85rem;gap:.7rem;border-radius:13px}
    .avatar{width:40px;height:40px}
    .bottom-nav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:50;
      background:rgba(7,22,43,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(217,166,46,.35);
      padding:.3rem .4rem;padding-bottom:max(.3rem,env(safe-area-inset-bottom))}
    .bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:52px;color:#9fb0c6;
      text-decoration:none;font-size:.68rem;font-weight:500;border-radius:11px;letter-spacing:.02em}
    .bottom-nav a.active{color:var(--gold);background:rgba(217,166,46,.12)}
    body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
    .toast-wrap{top:auto;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));left:1rem;right:1rem;align-items:center}
    .toast{max-width:none;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brandmark"><span class="mark">bg</span>BetterGrowth <span class="admin-badge" id="adminBadge" hidden>ADMIN</span></div>
  <nav class="nav-links" id="topNav" aria-label="Main"></nav>
  <div class="spacer"></div>
  <div class="tools">
    <button class="tbtn ghost" id="refreshBtn" type="button" aria-label="Refresh list">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg>
      <span class="lbl">Refresh</span>
    </button>
    <button class="tbtn" type="button" onclick="logout()" aria-label="Sign out">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      <span class="lbl">Sign out</span>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>Sent emails</h1>
      <p id="count" aria-live="polite">Loading your emails…</p>
    </div>
    <a class="btn" href="send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New email
    </a>
  </div>

  <div id="controls" hidden>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search recipient, subject or attachment…" aria-label="Search sent emails" autocomplete="off"/>
    </label>
    <div class="chips" id="timeChips" aria-label="Filter by date">
      <button class="chip active" data-filter="all" type="button">All</button>
      <button class="chip" data-filter="today" type="button">Today</button>
      <button class="chip" data-filter="week" type="button">This week</button>
    </div>
    <div class="chips" id="statusChips" aria-label="Filter by status" hidden></div>
  </div>

  <div class="list" id="emailList" aria-live="polite"></div>
</div>

<footer class="credit">
  Made by <a href="https://rajvardhansingh.in/" target="_blank" rel="noopener noreferrer">Rajvardhan Singh</a>
</footer>

<nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>
const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
/* If your server uses different names for these, change them here. */
const LIST_ACTION = "sent";   // other version of this page used "outbound_list"
const VIEW_PAGE   = "view";   // other version of this page used "sent-view"
const ADMIN_EMAIL = "admin@bettergrowthsolutions.com";
const $ = id => document.getElementById(id);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const authHeaders = () => ({ Authorization: "Bearer " + store.get("token") });
const USER = (store.get("user") || "").toLowerCase();
const IS_ADMIN = USER === ADMIN_EMAIL;

function esc(s = "") {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtShort(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}
function fmtRel(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(mins)) return "";
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const h = Math.floor(mins / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  return d < 7 ? d + "d ago" : "";
}
function statusClass(status = "") {
  const s = String(status).toLowerCase();
  return s === "sent" ? "ok" : /fail|error|bounce|reject/.test(s) ? "bad" : "warn";
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function htmlToText(html = "") {
  try { return (new DOMParser().parseFromString(html, "text/html").body.textContent || ""); }
  catch { return String(html).replace(/<[^>]*>/g, " "); }
}
function textOf(e) {
  if (e._text === undefined) {
    const raw = e.body || (e.html ? htmlToText(e.html) : "") || "";
    e._text = String(raw).replace(/\s+/g, " ").trim();
  }
  return e._text;
}

/* Navigation */
const IC = {
  home:  '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  send:  '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>',
  sent:  '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>',
  inbox: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/>',
  logs:  '<path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/>'
};
const NAV = IS_ADMIN
  ? [["admin","Admin","home"],["send","Send","send"],["sent","Sent","sent"],["inbox","Inbox","inbox"],["admin_logs","Logs","logs"]]
  : [["dashboard","Dashboard","home"],["send","Send","send"],["sent","Sent","sent"],["inbox","Inbox","inbox"]];

function buildNav() {
  const link = (size, sw) => ([href, label, icon]) => `
    <a href="${href}" ${href === "sent" ? 'class="active" aria-current="page"' : ""}>
      <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[icon]}</svg>${label}</a>`;
  $("topNav").innerHTML = NAV.map(link(15, 2)).join("");
  $("bottomNav").innerHTML = NAV.map(link(22, 1.9)).join("");
  $("bottomNav").style.gridTemplateColumns = `repeat(${NAV.length},1fr)`;
}

/* State */
let ALL = [];
let FILTER = "all", STATUS = "all", QUERY = "", SHOWN = 100;
const PAGE = 100;
const skeleton = () => Array.from({ length: 5 }, () => '<div class="skel"></div>').join("");

async function load() {
  const btn = $("refreshBtn");
  btn.classList.add("spin"); btn.disabled = true;
  $("count").textContent = "Loading your emails…";
  $("emailList").innerHTML = skeleton();
  try {
    const r = await fetch(FN + "?action=" + LIST_ACTION, { headers: authHeaders() });
    if (r.status === 401) return logout();
    if (!r.ok) throw new Error("HTTP " + r.status);

    const data = await r.json();
    ALL = Array.isArray(data) ? data : [];
    SHOWN = PAGE;
    $("controls").hidden = ALL.length === 0;
    renderStatusChips();
    render();
  } catch (err) {
    $("count").textContent = "";
    $("emailList").innerHTML = `<div class="empty">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
      <b>We couldn't load your emails</b>
      ${esc(err.message === "Failed to fetch" ? "Check your connection and try again." : err.message)}
      <div><button class="btn" type="button" onclick="load()">Try again</button></div>
    </div>`;
  } finally {
    btn.classList.remove("spin"); btn.disabled = false;
  }
}

/* Status chips only appear when there is more than one status to filter by */
function renderStatusChips() {
  const box = $("statusChips");
  const counts = {};
  ALL.forEach(e => { const s = String(e.status || "unknown").toLowerCase(); counts[s] = (counts[s] || 0) + 1; });
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (STATUS !== "all" && !counts[STATUS]) STATUS = "all";
  if (keys.length < 2) { box.hidden = true; return; }
  box.innerHTML = `<span class="lab">Status</span>
    <button class="chip ${STATUS === "all" ? "active" : ""}" data-status="all" type="button">All</button>` +
    keys.map(k => `<button class="chip ${STATUS === k ? "active" : ""}" data-status="${esc(k)}" type="button">${esc(cap(k))} <span class="n">${counts[k]}</span></button>`).join("");
  box.hidden = false;
}

function visible() {
  let list = ALL;
  if (FILTER === "today") {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    list = list.filter(e => new Date(e.created_at) >= start);
  } else if (FILTER === "week") {
    const start = new Date(Date.now() - 7 * 86400000);
    list = list.filter(e => new Date(e.created_at) >= start);
  }
  if (STATUS !== "all") list = list.filter(e => String(e.status || "unknown").toLowerCase() === STATUS);
  const q = QUERY.toLowerCase();
  if (q) {
    list = list.filter(e =>
      [e.to_email, e.cc_email, e.subject, e.attachment_name, e.status, e.from_email, e.sender_email]
        .some(v => String(v || "").toLowerCase().includes(q)) ||
      textOf(e).toLowerCase().includes(q));
  }
  return list;
}

const CLIP = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>';

function render() {
  const box = $("emailList");
  const n = ALL.length;
  const list = visible();

  $("count").textContent = !n ? "Nothing sent yet."
    : list.length === n ? `${n} ${n === 1 ? "email" : "emails"} sent`
    : `Showing ${list.length} of ${n} emails`;

  if (!list.length) {
    const narrowed = n > 0;
    box.innerHTML = narrowed
      ? `<div class="empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <b>No matches</b>No sent emails match your search or filters.
        </div>`
      : `<div class="empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          <b>No emails sent yet</b>Emails you send will appear here.
          <div><a class="btn" href="send">Send your first email</a></div>
        </div>`;
    return;
  }

  let html = list.slice(0, SHOWN).map(e => {
    const to = e.to_email || "—";
    const sc = statusClass(e.status);
    const preview = textOf(e).slice(0, 200);
    const from = (e.from_email || e.sender_email || "").split("@")[0];
    return `
      <a class="mail ${sc === "bad" ? "failed" : ""}" href="${VIEW_PAGE}?id=${encodeURIComponent(e.id)}">
        <div class="avatar" aria-hidden="true">${esc(((to[0]) || "?").toUpperCase())}</div>
        <div class="body">
          <div class="row1">
            <span class="to">To: ${esc(to)}</span>
            <span class="time">${esc(fmtRel(e.created_at) || fmtShort(e.created_at))}</span>
          </div>
          <div class="subject">${esc(e.subject || "(No subject)")}</div>
          ${preview ? `<div class="preview">${esc(preview)}</div>` : ""}
          <div class="tags">
            <span class="tag ${sc}">${esc(cap(String(e.status || "unknown")))}</span>
            ${e.cc_email ? `<span class="tag cc" title="${esc(e.cc_email)}">Cc: ${esc(e.cc_email)}</span>` : ""}
            ${e.attachment_name ? `<span class="tag att" title="${esc(e.attachment_name)}">${CLIP}${esc(e.attachment_name)}</span>` : ""}
            ${from ? `<span class="tag from">from ${esc(from)}</span>` : ""}
          </div>
        </div>
      </a>`;
  }).join("");

  if (list.length > SHOWN) {
    html += `<div class="more"><button class="btn ghost" id="moreBtn" type="button">Show more (${list.length - SHOWN} left)</button></div>`;
  }
  box.innerHTML = html;
  const mb = $("moreBtn");
  if (mb) mb.addEventListener("click", () => { SHOWN += PAGE; render(); });
}

/* Filters */
$("timeChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  $("timeChips").querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  FILTER = chip.dataset.filter;
  SHOWN = PAGE;
  render();
});
$("statusChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  STATUS = chip.dataset.status;
  SHOWN = PAGE;
  renderStatusChips();
  render();
});
$("search").addEventListener("input", e => { QUERY = e.target.value.trim(); SHOWN = PAGE; render(); });
$("refreshBtn").addEventListener("click", load);

/* Sign out: also tells the server so the session shows up in the admin logs */
async function logout() {
  const token = store.get("token");
  const sessionId = store.get("bg_session_id");
  const loginAt = Number(store.get("bg_login_at") || 0);
  const duration = loginAt ? Math.round((Date.now() - loginAt) / 1000) : null;
  try {
    if (token && sessionId) {
      await fetch(FN + "?action=log_logout", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ session_id: sessionId, duration_sec: duration })
      });
    }
  } catch {}
  ["token","user","isAdmin","bg_session_id","bg_login_at","bg_sid","bg_captcha_ok","bg_admin_captcha_ok"].forEach(store.del);
  location.href = "/";
}

/* Boot */
if (!store.get("token")) { location.href = "/"; }
else {
  $("adminBadge").hidden = !IS_ADMIN;
  buildNav();
  load();
}
</script>
</body>
</html>
