<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sent · BetterGrowth</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; margin: 0;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 1000px; margin: auto; }
  a.back { color: #60a5fa; text-decoration: none; font-size: .9rem; }
  a.back:hover { text-decoration: underline; }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    margin: .75rem 0 1rem;
  }
  h1 { margin: 0; font-size: 1.3rem; }
  .refresh {
    background: #334155; border: none; color: #e2e8f0;
    padding: .5rem .9rem; border-radius: 8px; cursor: pointer;
    font-size: .85rem; transition: background .15s;
  }
  .refresh:hover { background: #475569; }
  table {
    width: 100%; border-collapse: collapse;
    background: #1e293b; border-radius: 12px; overflow: hidden;
    font-size: .88rem; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  th, td {
    padding: .75rem .9rem; text-align: left;
    border-bottom: 1px solid #334155; vertical-align: top;
  }
  th {
    color: #94a3b8; font-weight: 600; font-size: .8rem;
    text-transform: uppercase; letter-spacing: .03em;
    background: #172033;
  }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover td { background: #223049; }
  tr:last-child td { border-bottom: none; }
  .ok { color: #4ade80; font-weight: 600; }
  .fail { color: #f87171; font-weight: 600; }
  .subj { max-width: 260px; }
  .cc { display: block; color: #64748b; font-size: .76rem; margin-top: .2rem; }
  .empty {
    text-align: center; padding: 2.5rem 1rem;
    color: #64748b; font-size: .9rem;
  }
  .err-row {
    text-align: center; padding: 2rem; color: #fecaca;
    background: #7f1d1d; border-radius: 12px;
  }
  .att { color: #60a5fa; font-size: .82rem; }

  /* ===== MODAL ===== */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
    padding: 1rem; z-index: 100;
    backdrop-filter: blur(3px);
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #1e293b; border-radius: 14px;
    width: 100%; max-width: 720px; max-height: 90vh;
    overflow-y: auto; padding: 1.75rem;
    box-shadow: 0 25px 60px rgba(0,0,0,.6);
    border: 1px solid #334155;
    animation: pop .18s ease-out;
  }
  @keyframes pop {
    from { transform: scale(.96); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .modal h2 {
    margin: 0 0 1.25rem; font-size: 1.15rem; color: #f1f5f9;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal .close {
    background: transparent; border: none; color: #94a3b8;
    font-size: 1.5rem; cursor: pointer; padding: 0 .4rem;
    line-height: 1;
  }
  .modal .close:hover { color: #f1f5f9; }
  .field { margin-bottom: 1rem; }
  .field-label {
    font-size: .72rem; color: #94a3b8; text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: .3rem; font-weight: 600;
  }
  .field-value {
    background: #0f172a; padding: .7rem .9rem; border-radius: 8px;
    font-size: .9rem; word-break: break-word;
    border: 1px solid #1e293b;
  }
  .field-value.mono {
    font-family: monospace; font-size: .82rem;
    max-height: 320px; overflow-y: auto; white-space: pre-wrap;
  }
  .pill {
    display: inline-block; padding: .18rem .55rem; border-radius: 999px;
    font-size: .75rem; font-weight: 600;
  }
  .pill.sent { background: #14532d; color: #bbf7d0; }
  .pill.failed { background: #7f1d1d; color: #fecaca; }
  .attach-tag {
    display: inline-flex; align-items: center; gap: .35rem;
    background: #172033; border: 1px solid #334155;
    padding: .35rem .7rem; border-radius: 8px;
    font-size: .82rem; color: #cbd5e1;
  }
  .hint {
    font-size: .78rem; color: #64748b;
    margin: .25rem 0 1rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back</a>
  <div class="head">
    <h1>Sent Emails</h1>
    <button class="refresh" onclick="load()">🔄 Refresh</button>
  </div>
  <p class="hint">Click any row to see the full email details.</p>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>To</th>
        <th>Subject</th>
        <th>Attachment</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="5" class="empty">Loading…</td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" id="modalBody" onclick="event.stopPropagation()">
    <h2>
      <span>Email Details</span>
      <button class="close" onclick="closeModal()">×</button>
    </h2>
    <div id="modalContent"></div>
  </div>
</div>

<script>
  const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
  const $ = id => document.getElementById(id);

  if (!localStorage.getItem("token")) {
    location.href = "index.html";
  }

  let EMAILS = [];

  function escapeHtml(s = "") {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  async function load() {
    const tbody = $("rows");
    tbody.innerHTML = `<tr><td colspan="5" class="empty">Loading…</td></tr>`;

    try {
      const r = await fetch(FN + "?action=sent", {
        headers: { Authorization: "Bearer " + localStorage.getItem("token") },
      });

      if (r.status === 401) {
        localStorage.clear();
        location.href = "index.html";
        return;
      }

      const list = await r.json();

      if (!Array.isArray(list) || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">No emails sent yet.</td></tr>`;
        return;
      }

      EMAILS = list;

      tbody.innerHTML = list.map((e, i) => `
        <tr onclick="openModal(${i})">
          <td>${new Date(e.created_at).toLocaleString()}</td>
          <td>
            ${escapeHtml(e.to_email || "")}
            ${e.cc_email ? `<span class="cc">CC: ${escapeHtml(e.cc_email)}</span>` : ""}
          </td>
          <td class="subj">${escapeHtml(e.subject || "")}</td>
          <td>${e.attachment_name
            ? `<span class="att">📎 ${escapeHtml(e.attachment_name)}</span>`
            : "—"}</td>
          <td class="${e.status === "sent" ? "ok" : "fail"}">${escapeHtml(e.status || "")}</td>
        </tr>
      `).join("");
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" class="err-row">Error: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  function openModal(index) {
    const e = EMAILS[index];
    if (!e) return;

    const statusClass = e.status === "sent" ? "sent" : "failed";
    const bodyPreview = escapeHtml(e.body || "");
    const safeHtmlPreview = e.body || "";

    $("modalContent").innerHTML = `
      <div class="field">
        <div class="field-label">Status</div>
        <span class="pill ${statusClass}">${escapeHtml(e.status)}</span>
      </div>

      <div class="field">
        <div class="field-label">Sent at</div>
        <div class="field-value">${new Date(e.created_at).toLocaleString()}</div>
      </div>

      <div class="field">
        <div class="field-label">From</div>
        <div class="field-value">HR &lt;hr@bettergrowthsolutions.com&gt;</div>
      </div>

      <div class="field">
        <div class="field-label">To</div>
        <div class="field-value">${escapeHtml(e.to_email || "—")}</div>
      </div>

      ${e.cc_email ? `
      <div class="field">
        <div class="field-label">CC</div>
        <div class="field-value">${escapeHtml(e.cc_email)}</div>
      </div>` : ""}

      ${e.bcc_email ? `
      <div class="field">
        <div class="field-label">BCC</div>
        <div class="field-value">${escapeHtml(e.bcc_email)}</div>
      </div>` : ""}

      <div class="field">
        <div class="field-label">Subject</div>
        <div class="field-value">${escapeHtml(e.subject || "—")}</div>
      </div>

      ${e.attachment_name ? `
      <div class="field">
        <div class="field-label">Attachment</div>
        <div><span class="attach-tag">📎 ${escapeHtml(e.attachment_name)}</span></div>
      </div>` : ""}

      <div class="field">
        <div class="field-label">Body (HTML source)</div>
        <div class="field-value mono">${bodyPreview}</div>
      </div>

      <div class="field">
        <div class="field-label">Body (Rendered preview)</div>
        <div class="field-value" style="background:#ffffff;color:#111;">${safeHtmlPreview}</div>
      </div>

      ${e.resend_id ? `
      <div class="field">
        <div class="field-label">Resend ID</div>
        <div class="field-value mono">${escapeHtml(e.resend_id)}</div>
      </div>` : ""}
    `;

    $("modalBackdrop").classList.add("show");
  }

  function closeModal(ev) {
    // Close if backdrop clicked or X pressed
    if (ev && ev.target !== $("modalBackdrop")) return;
    $("modalBackdrop").classList.remove("show");
  }

  // Esc key closes
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") $("modalBackdrop").classList.remove("show");
  });

  load();
</script>
</body>
</html>
