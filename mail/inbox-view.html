<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#07162b"/>
<title>Email · BetterGrowth Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --navy-900:#07162b; --navy-800:#0b2038; --navy-700:#143252;
    --gold:#d9a62e; --gold-deep:#b8841a;
    --paper:#f5f6f8; --white:#fff; --ink:#0b1b30; --muted:#5a6a7f;
    --line:#dde2ea; --bad:#9b1c1c; --bad-bg:#fde4e4;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);margin:0;padding:1.25rem;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .wrap{max-width:900px; margin:auto}
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    gap:.75rem; margin-bottom:1rem; flex-wrap:wrap;
  }
  a.back{
    color:var(--navy-700); text-decoration:none; font-size:.9rem;
    display:inline-flex; align-items:center; gap:.35rem; font-weight:500;
  }
  a.back:hover{color:var(--gold-deep)}
  .actions{display:flex; gap:.5rem; flex-wrap:wrap}
  .btn{
    background:var(--gold); color:var(--navy-900); border:0;
    padding:.5rem .9rem; border-radius:8px; font:inherit;
    font-weight:600; cursor:pointer; font-size:.85rem;
    display:inline-flex; align-items:center; gap:.4rem;
  }
  .btn:hover{background:#e4b343}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
  .btn.ghost:hover{background:#fbfcfd}
  .btn.red{background:#9b1c1c; color:#fff}
  .btn.red:hover{background:#7c1515}

  .card{
    background:var(--white); border-radius:14px;
    padding:1.75rem; margin-bottom:1.25rem;
    box-shadow:0 4px 16px rgba(11,27,48,.05);
    border:1.5px solid var(--line);
  }
  .head{
    padding-bottom:1rem; border-bottom:1px solid var(--line); margin-bottom:1.25rem;
  }
  .head h1{
    font-family:var(--serif); font-weight:700; font-size:1.5rem;
    margin:0 0 .6rem; color:var(--ink); line-height:1.25;
  }
  .meta-grid{
    display:grid; grid-template-columns:90px 1fr;
    row-gap:.5rem; column-gap:1rem;
    font-size:.9rem;
  }
  .meta-grid .label{
    color:var(--muted); font-size:.75rem;
    text-transform:uppercase; letter-spacing:.05em;
    font-weight:600; padding-top:.15rem;
  }
  .meta-grid .value{word-break:break-word}
  .meta-grid .value.mono{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.82rem; color:#475569;
  }
  .status-pill{
    display:inline-block;
    padding:.2rem .6rem; border-radius:99px;
    font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em;
  }
  .status-pill.unread{background:rgba(217,166,46,.18); color:var(--gold-deep)}
  .status-pill.read{background:#e9edf3; color:var(--muted)}

  h2.section{
    font-family:var(--serif); font-weight:700; font-size:1.1rem;
    margin:1.5rem 0 .6rem; color:var(--ink);
  }
  .body-content{
    background:var(--paper); padding:1.25rem;
    border-radius:10px; font-size:.95rem; line-height:1.65;
    white-space:pre-wrap; word-break:break-word;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    max-height:600px; overflow-y:auto;
  }
  .loading{text-align:center; padding:3rem; color:var(--muted)}
  .error{
    background:var(--bad-bg); color:var(--bad);
    padding:1rem 1.25rem; border-radius:10px;
    text-align:center;
  }
  @media (max-width:600px){
    .meta-grid{grid-template-columns:1fr; row-gap:.15rem}
    .label{padding-top:.5rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="inbox">← Back to Inbox</a>
    <div class="actions">
      <button class="btn ghost" onclick="markRead()" id="markBtn">✓ Mark as read</button>
      <button class="btn red" onclick="del()">🗑 Delete</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">Loading email…</div>
  </div>
</div>

<script>
const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
const $ = id => document.getElementById(id);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

function esc(s = "") {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString(undefined, { dateStyle: "full", timeStyle: "short" });
}

const id = new URLSearchParams(location.search).get("id");
let EMAIL = null;

async function load() {
  if (!id) {
    $("content").innerHTML = `<div class="error">Missing email ID.</div>`;
    return;
  }
  try {
    const r = await fetch(FN + "?action=inbound_get&id=" + encodeURIComponent(id), {
      headers: { Authorization: "Bearer " + store.get("token") }
    });
    if (r.status === 401) { location.href = "/"; return; }
    if (!r.ok) {
      const e = await r.json().catch(()=>({}));
      throw new Error(e.error || "HTTP " + r.status);
    }
    EMAIL = await r.json();
    render(EMAIL);
  } catch (err) {
    $("content").innerHTML = `<div class="error">❌ ${esc(err.message)}</div>`;
  }
}

function render(e) {
  const statusCls = e.status === "unread" ? "unread" : "read";

  $("content").innerHTML = `
    <div class="card">
      <div class="head">
        <h1>${esc(e.subject || "(no subject)")}</h1>
        <div class="meta-grid">
          <div class="label">Status</div>
          <div class="value"><span class="status-pill ${statusCls}">${esc(e.status)}</span></div>

          <div class="label">From</div>
          <div class="value">${esc(e.from_email || "—")}</div>

          <div class="label">To</div>
          <div class="value">${esc(e.recipient_email || "—")}</div>

          <div class="label">Received</div>
          <div class="value">${esc(fmtTime(e.created_at))}</div>

          <div class="label">ID</div>
          <div class="value mono">${esc(e.id)}</div>
        </div>
      </div>

      <h2 class="section" style="margin-top:0">Message</h2>
      <div class="body-content">${esc(e.body || "(empty)")}</div>
    </div>
  `;

  // Update "Mark as read" button visibility
  if (e.status === "read") {
    $("markBtn").style.display = "none";
  }
}

async function markRead() {
  if (!EMAIL) return;
  try {
    const r = await fetch(FN + "?action=inbound_mark_read", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + store.get("token")
      },
      body: JSON.stringify({ id: EMAIL.id })
    });
    if (r.ok) {
      EMAIL.status = "read";
      render(EMAIL);
    }
  } catch {}
}

async function del() {
  if (!EMAIL) return;
  if (!confirm("Delete this email?")) return;
  try {
    const r = await fetch(FN + "?action=inbound_delete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + store.get("token")
      },
      body: JSON.stringify({ id: EMAIL.id })
    });
    if (r.ok) {
      location.href = "inbox";
    } else {
      alert("Delete failed");
    }
  } catch {
    alert("Delete failed");
  }
}

if (!store.get("token")) { location.href = "/"; }
else load();
</script>
</body>
</html>
