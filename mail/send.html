<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07162b" />
  <title>Sent · BetterGrowth Mail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & VARIABLES ===== */
    :root {
      --navy-950: #050f1f;
      --navy-900: #07162b;
      --navy-800: #0b2038;
      --navy-700: #143252;
      --gold: #d9a62e;
      --gold-deep: #b8841a;
      --gold-soft: #f1d899;
      --paper: #f4f5f8;
      --white: #fff;
      --ink: #0b1b30;
      --muted: #5a6a7f;
      --line: #dde2ea;
      --ok: #17653a;
      --ok-bg: #e3f4ea;
      --bad: #9b1c1c;
      --bad-bg: #fde4e4;
      --warn: #7a5410;
      --warn-bg: #fdf1d6;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --shadow-sm: 0 2px 8px rgba(11, 27, 48, 0.06);
      --shadow-md: 0 8px 24px -8px rgba(11, 27, 48, 0.12);
      --shadow-lg: 0 20px 40px -12px rgba(11, 27, 48, 0.2);
      --radius-card: 18px;
      --radius-btn: 11px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }
    button { font-family: inherit; cursor: pointer; }
    svg { flex: none; display: block; }
    a { color: inherit; text-decoration: none; }

    /* ===== APP LAYOUT ===== */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      background: linear-gradient(90deg, var(--navy-950) 0%, var(--navy-700) 100%);
      color: #e9eef6;
      padding: 0.6rem 1.25rem;
      padding-top: max(0.6rem, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      gap: 0.9rem;
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      flex-wrap: wrap;
    }
    .brandmark {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.55rem;
      white-space: nowrap;
    }
    .brandmark .mark {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      font-size: 1rem;
      color: #fff;
    }
    .nav-links {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.25rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .nav-links a.active { background: var(--gold); color: var(--navy-900); font-weight: 600; }
    .topbar-spacer { flex: 1; }
    .tbtn {
      background: var(--gold); color: var(--navy-900);
      border: 0; padding: 0.5rem 1rem; border-radius: 10px;
      font-weight: 600; font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 0.4rem;
      transition: background 0.15s, transform 0.08s;
      min-height: 40px;
    }
    .tbtn:hover:not(:disabled) { background: #e4b343; }
    .tbtn:active:not(:disabled) { transform: translateY(1px); }
    .tbtn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tbtn.ghost {
      background: transparent; color: #e9eef6;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
    }
    .tbtn.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.09); }

    /* ===== MAIN WRAP ===== */
    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 1.25rem;
      width: 100%;
      flex: 1;
    }

    /* ===== HEADER SECTION ===== */
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .page-head h1 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 2rem;
      line-height: 1.1;
      color: var(--ink);
    }
    .page-head h1 small {
      display: block;
      font-family: var(--sans);
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: 0.3rem;
      letter-spacing: 0.01em;
    }
    .head-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ===== FILTER CHIPS ===== */
    .filter-chips {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .chip {
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--ink);
      min-height: 38px;
      display: inline-flex;
      align-items: center;
    }
    .chip:hover { background: #eceef2; border-color: #c3cbd7; }
    .chip.active {
      background: var(--navy-800);
      color: #fff;
      border-color: var(--navy-800);
      box-shadow: 0 4px 12px rgba(11, 32, 56, 0.25);
    }

    /* ===== ACCOUNT QUICK FILTERS (5 accounts) ===== */
    .account-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: var(--white);
      border-radius: 16px;
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-sm);
      align-items: center;
    }
    .account-filters .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
      margin-right: 0.5rem;
      white-space: nowrap;
    }
    .acc-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1.5px solid var(--line);
      background: var(--white);
      color: var(--ink);
      transition: all 0.15s;
      white-space: nowrap;
      cursor: pointer;
      min-height: 36px;
    }
    .acc-chip:hover { background: #f0f2f6; border-color: #b8c2d0; }
    .acc-chip.active {
      background: var(--navy-800);
      color: #fff;
      border-color: var(--navy-800);
    }
    .acc-chip .badge {
      background: var(--gold);
      color: var(--navy-900);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: 99px;
      min-width: 20px;
      text-align: center;
    }
    .acc-chip.active .badge {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* ===== EMAIL LIST ===== */
    .list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .email-card {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: var(--ink);
      transition: all 0.18s ease;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .email-card:hover {
      background: #fbfcfd;
      border-color: #c3cbd7;
      transform: translateX(4px);
      box-shadow: var(--shadow-md);
    }
    .email-card.sent {
      border-left: 5px solid #6b8cae;
      background: #f8fafc;
    }
    .email-card.sent .dot {
      background: #6b8cae;
      box-shadow: 0 0 0 3px rgba(107, 140, 174, 0.15);
    }
    .email-card .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--gold);
      flex: none;
      margin-top: 0.55rem;
      box-shadow: 0 0 0 3px rgba(217, 166, 46, 0.15);
    }
    .email-card .body { flex: 1; min-width: 0; }
    .email-card .row1 {
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.25rem;
      align-items: baseline;
    }
    .email-card .from {
      font-weight: 600;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .email-card .from .acct-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 6px;
      background: rgba(107, 140, 174, 0.15);
      color: #3a5a7a;
      white-space: nowrap;
    }
    .email-card .time {
      font-size: 0.75rem;
      color: var(--muted);
      flex: none;
      white-space: nowrap;
    }
    .email-card .subject {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.15rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
    }
    .email-card .preview {
      font-size: 0.82rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
    }
    .email-card .recipient-tag {
      display: inline-block;
      background: rgba(107, 140, 174, 0.1);
      color: #3a5a7a;
      padding: 0.15rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 0.4rem;
    }

    /* ===== EMPTY / LOADING ===== */
    .empty {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--muted);
      background: var(--white);
      border-radius: var(--radius-card);
      border: 1.5px dashed var(--line);
      box-shadow: var(--shadow-sm);
    }
    .empty svg { opacity: 0.35; margin: 0 auto 0.75rem; }
    .empty b {
      display: block;
      color: var(--ink);
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
    .skel {
      border-radius: 12px;
      background: linear-gradient(90deg, #eceff4 25%, #f6f7fa 50%, #eceff4 75%);
      background-size: 200% 100%;
      animation: sh 1.2s infinite;
    }
    @keyframes sh { to { background-position: -200% 0; } }

    /* ===== TOASTS ===== */
    .toast-wrap {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 99;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    .toast {
      background: var(--navy-800);
      color: #e9eef6;
      padding: 0.8rem 1.1rem;
      border-radius: 12px;
      font-size: 0.88rem;
      border-left: 5px solid var(--gold);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      animation: slidein 0.3s ease-out;
      max-width: 340px;
      pointer-events: auto;
    }
    .toast.ok { border-left-color: #4ade80; }
    .toast.err { border-left-color: #f87171; }
    @keyframes slidein {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    /* ===== CONFIRM DIALOG ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 22, 43, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .overlay.show { display: flex; }
    .dialog {
      background: #fff;
      border-radius: 20px;
      padding: 1.8rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      animation: pop 0.2s ease-out;
    }
    @keyframes pop {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .dialog .ico {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--bad-bg);
      color: var(--bad);
      display: grid;
      place-items: center;
      margin-bottom: 0.9rem;
    }
    .dialog h3 {
      font-family: var(--serif);
      font-size: 1.6rem;
      margin: 0 0 0.4rem;
      font-weight: 700;
    }
    .dialog p {
      margin: 0 0 1.4rem;
      color: var(--muted);
      font-size: 0.93rem;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .dialog .row {
      display: flex;
      gap: 0.7rem;
    }
    .dialog .row .btn { flex: 1; }
    .btn {
      background: var(--gold);
      color: var(--navy-900);
      border: 0;
      min-height: 46px;
      padding: 0 1.2rem;
      border-radius: var(--radius-btn);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(217, 166, 46, 0.25);
    }
    .btn:hover:not(:disabled) { background: #e4b343; box-shadow: 0 6px 16px rgba(217, 166, 46, 0.35); }
    .btn:active:not(:disabled) { transform: translateY(2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--line);
      box-shadow: none;
    }
    .btn.ghost:hover:not(:disabled) { background: var(--paper); border-color: #c3cbd7; }
    .btn.red {
      background: var(--bad);
      color: #fff;
      box-shadow: 0 2px 8px rgba(155, 28, 28, 0.25);
    }
    .btn.red:hover:not(:disabled) { background: #7c1515; box-shadow: 0 6px 16px rgba(155, 28, 28, 0.35); }

    /* ===== CREDIT ===== */
    .credit {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1rem 1rem 1.5rem;
      border-top: 1px solid var(--line);
      margin-top: 1rem;
    }
    .credit a {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 1px;
      transition: color 0.15s;
    }
    .credit a:hover { color: var(--gold-deep); }

    /* ===== MOBILE ===== */
    @media (max-width: 700px) {
      .topbar {
        padding: 0.55rem 0.9rem;
        padding-top: max(0.55rem, env(safe-area-inset-top));
        gap: 0.6rem;
      }
      .brandmark { font-size: 1.1rem; }
      .brandmark .mark { width: 30px; height: 30px; font-size: 0.9rem; border-radius: 8px; }
      .nav-links a { padding: 0.35rem 0.6rem; font-size: 0.75rem; }
      .nav-links a span { display: none; }
      .wrap { padding: 0.85rem; }
      .page-head h1 { font-size: 1.6rem; }
      .page-head { flex-direction: column; align-items: stretch; }
      .head-actions { width: 100%; }
      .filter-chips { flex: 1; }
      .chip { flex: 1; justify-content: center; }
      .account-filters { padding: 0.6rem 0.75rem; gap: 0.4rem; }
      .acc-chip { font-size: 0.72rem; padding: 0.3rem 0.7rem; }
      .email-card { padding: 0.9rem 1rem; border-radius: 12px; gap: 0.7rem; }
      .email-card .from { font-size: 0.9rem; }
      .email-card .subject { font-size: 0.85rem; }
      .email-card .preview { font-size: 0.78rem; -webkit-line-clamp: 2; }
      .overlay { align-items: flex-end; padding: 0; }
      .dialog {
        border-radius: 22px 22px 0 0;
        padding: 1.5rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));
        animation: sheet 0.3s ease-out;
        max-width: none;
      }
      @keyframes sheet {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      .toast-wrap {
        top: auto;
        bottom: calc(92px + env(safe-area-inset-bottom));
        left: 1rem;
        right: 1rem;
        align-items: center;
      }
      .toast { max-width: none; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="brandmark">
      <span class="mark">bg</span>
      <span class="name">BetterGrowth</span>
    </div>

    <nav class="nav-links" id="mainNav">
      <a href="#" id="navDash">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#" id="navSend">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        <span>Send</span>
      </a>
      <a href="#" id="navSent" class="active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
        <span>Sent</span>
      </a>
      <a href="#" id="navInbox">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/><circle cx="12" cy="9" r="2" fill="currentColor" stroke="none"/></svg>
        <span>Inbox</span>
      </a>
    </nav>

    <div class="topbar-spacer"></div>
    <button class="tbtn ghost" onclick="loadSent()" title="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span style="display:none">Refresh</span>
    </button>
    <button class="tbtn" onclick="logout()">Sign out</button>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="wrap" id="mainWrap">
    <!-- ===== SENT VIEW ===== -->
    <div id="sentView">
      <div class="page-head">
        <h1>
          Sent
          <small id="sentSubtitle">Loading…</small>
        </h1>
        <div class="head-actions">
          <div class="filter-chips" id="filterChips">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="today">Today</button>
            <button class="chip" data-filter="week">This week</button>
          </div>
        </div>
      </div>

      <!-- 5 ACCOUNT QUICK FILTERS -->
      <div class="account-filters" id="accountFilters">
        <span class="label">Accounts</span>
        <!-- filled by JS -->
      </div>

      <div class="list" id="emailList">
        <div class="loading">Loading sent emails…</div>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="credit">
    Made by <a href="https://rajvardhansingh.in/" target="_blank" rel="noopener noreferrer">Rajvardhan Singh</a>
  </footer>
</div>

<!-- ===== TOASTS ===== -->
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>
  /* ============================================================
     CONFIG & HELPERS
     ============================================================ */
  const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
  const $ = id => document.getElementById(id);

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };

  const authHeaders = () => ({ Authorization: "Bearer " + store.get("token") });

  function esc(s = "") {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function fmtShort(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }
  function fmtRel(iso) {
    if (!iso) return "";
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const h = Math.floor(mins / 60);
    if (h < 24) return h + "h ago";
    const d = Math.floor(h / 24);
    return d < 30 ? d + "d ago" : "";
  }

  function toast(msg, kind = "") {
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = msg;
    $("toastWrap").appendChild(el);
    setTimeout(() => el.style.opacity = "0", 2400);
    setTimeout(() => el.remove(), 2800);
  }

  /* ============================================================
     STATE
     ============================================================ */
  let ALL_SENT = [];
  let FILTER = "all";
  let ACCOUNT_FILTER = "all";

  const FIVE_ACCOUNTS = [
    "admin@bettergrowthsolutions.com",
    "support@bettergrowthsolutions.com",
    "sales@bettergrowthsolutions.com",
    "info@bettergrowthsolutions.com",
    "billing@bettergrowthsolutions.com"
  ];

  function currentUser() {
    return (store.get("user") || "").toLowerCase();
  }
  function isAdmin() {
    return currentUser() === "admin@bettergrowthsolutions.com";
  }

  /* ============================================================
     NAV & LOGOUT
     ============================================================ */
  function logout() {
    store.del("token");
    store.del("user");
    location.href = "/";
  }

  // Nav active state is set by the HTML class; other nav links go to real pages
  document.querySelectorAll(".nav-links a").forEach(a => {
    const href = a.getAttribute("href");
    if (href && href !== "#") {
      // real link, let it navigate normally
      return;
    }
    a.addEventListener("click", e => {
      e.preventDefault();
      const page = a.id.replace("nav", "").toLowerCase();
      const routes = { dash: "dashboard", send: "send", sent: "sent", inbox: "inbox" };
      const target = routes[page] || "sent";
      location.href = target === "dashboard" ? (isAdmin() ? "admin" : "dashboard") : target;
    });
  });

  /* ============================================================
     LOAD SENT EMAILS
     ============================================================ */
  async function loadSent() {
    const box = $("emailList");
    box.innerHTML = `<div class="loading">Loading sent emails…</div>`;

    try {
      const r = await fetch(FN + "?action=outbound_list", { headers: authHeaders() });
      if (r.status === 401) return logout();
      if (!r.ok) throw new Error("HTTP " + r.status);

      ALL_SENT = await r.json();
      $("sentSubtitle").textContent = `Sent emails · ${ALL_SENT.length} total`;

      renderAccountFilters();
      renderSent();
    } catch (err) {
      box.innerHTML = `<div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
        <b>Could not load sent emails</b>
        ${esc(err.message)}
      </div>`;
    }
  }

  function renderAccountFilters() {
    const container = $("accountFilters");
    const counts = {};
    FIVE_ACCOUNTS.forEach(a => counts[a] = 0);
    ALL_SENT.forEach(e => {
      const sender = (e.from_email || "").toLowerCase();
      if (counts[sender] !== undefined) counts[sender]++;
    });

    let html = `<span class="label">Accounts</span>`;
    html += `<button class="acc-chip ${ACCOUNT_FILTER === "all" ? "active" : ""}" data-account="all">All</button>`;
    FIVE_ACCOUNTS.forEach(acc => {
      const short = acc.split("@")[0];
      const count = counts[acc] || 0;
      html += `<button class="acc-chip ${ACCOUNT_FILTER === acc ? "active" : ""}" data-account="${esc(acc)}">
        ${esc(short)}
        ${count ? `<span class="badge">${count}</span>` : ""}
      </button>`;
    });
    container.innerHTML = html;

    container.querySelectorAll(".acc-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        ACCOUNT_FILTER = btn.dataset.account;
        renderAccountFilters();
        renderSent();
      });
    });
  }

  function renderSent() {
    const box = $("emailList");
    let filtered = ALL_SENT;

    // Time filter
    if (FILTER === "today") {
      const start = new Date(); start.setHours(0, 0, 0, 0);
      filtered = filtered.filter(e => new Date(e.created_at) >= start);
    } else if (FILTER === "week") {
      const start = new Date(Date.now() - 7 * 86400000);
      filtered = filtered.filter(e => new Date(e.created_at) >= start);
    }

    // Account filter
    if (ACCOUNT_FILTER !== "all") {
      filtered = filtered.filter(e =>
        (e.from_email || "").toLowerCase() === ACCOUNT_FILTER.toLowerCase()
      );
    }

    if (!filtered.length) {
      box.innerHTML = `<div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
        <b>No sent emails ${FILTER === "all" ? "yet" : "for this filter"}</b>
        ${FILTER === "all" ? "Emails you send will appear here." : "Try a different filter."}
      </div>`;
      return;
    }

    box.innerHTML = filtered.map(e => {
      const toName = (e.to_email || e.recipient_email || "?").split("@")[0];
      const senderShort = (e.from_email || "").split("@")[0];

      return `
        <a class="email-card sent"
           href="sent-view?id=${encodeURIComponent(e.id)}">
          <span class="dot"></span>
          <div class="body">
            <div class="row1">
              <span class="from">
                To: ${esc(toName)}
                <span class="acct-badge">← ${esc(senderShort)}</span>
              </span>
              <span class="time">${esc(fmtRel(e.created_at)) || fmtShort(e.created_at)}</span>
            </div>
            <div class="subject">${esc(e.subject || "(no subject)")}</div>
            <div class="preview">${esc((e.body || e.html || "").slice(0, 200))}</div>
            <span class="recipient-tag">${esc(e.to_email || e.recipient_email || "—")}</span>
          </div>
        </a>
      `;
    }).join("");
  }

  /* ============================================================
     FILTER CHIPS
     ============================================================ */
  $("filterChips").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    FILTER = chip.dataset.filter;
    renderSent();
  });

  /* ============================================================
     BOOT
     ============================================================ */
  if (!store.get("token")) {
    location.href = "/";
  } else {
    const navDash = $("navDash");
    if (navDash) navDash.href = isAdmin() ? "admin" : "dashboard";
    loadSent();
  }
</script>
</body>
</html>
