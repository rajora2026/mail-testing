<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send Email · BetterGrowth</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; margin: 0;
    padding: 2rem 1rem;
  }
  .wrap {
    max-width: 680px; margin: auto;
    background: #1e293b; padding: 2rem; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  a.back { color: #60a5fa; text-decoration: none; font-size: .9rem; }
  a.back:hover { text-decoration: underline; }
  h1 { margin: .75rem 0 1.25rem; font-size: 1.3rem; }
  label { display: block; font-size: .82rem; color: #94a3b8; margin-top: .9rem; }
  input, textarea, button, select {
    width: 100%; padding: .75rem; margin-top: .3rem;
    border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: .95rem;
    font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
  textarea { min-height: 200px; resize: vertical; font-family: monospace; font-size: .9rem; }
  button {
    background: #3b82f6; border: none; cursor: pointer;
    font-weight: 600; margin-top: 1.25rem; transition: background .15s;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .row2 { display: flex; gap: 1rem; }
  .row2 > div { flex: 1; }
  .msg {
    margin-top: 1rem; padding: .8rem 1rem; border-radius: 8px;
    font-size: .9rem; display: none;
  }
  .msg.ok { background: #14532d; color: #bbf7d0; display: block; }
  .msg.err { background: #7f1d1d; color: #fecaca; display: block; }
  .file-note { font-size: .78rem; color: #64748b; margin-top: .25rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back</a>
  <h1>Send Email</h1>

  <label>To *</label>
  <input id="to" placeholder="candidate@example.com" />

  <div class="row2">
    <div>
      <label>CC (comma-separated)</label>
      <input id="cc" placeholder="manager@example.com" />
    </div>
    <div>
      <label>BCC (comma-separated)</label>
      <input id="bcc" placeholder="records@example.com" />
    </div>
  </div>

  <label>Subject *</label>
  <input id="subject" placeholder="Interview Invitation – BetterGrowth Solutions" />

  <label>Body (HTML allowed) *</label>
  <textarea id="body" placeholder="<p>Hi Candidate,</p>
<p>We'd like to invite you for an interview…</p>"></textarea>

  <label>Attachment (optional · max ~5 MB)</label>
  <input id="attachment" type="file" />
  <div class="file-note" id="fileNote"></div>

  <button id="sendBtn" onclick="send()">Send Email</button>
  <div id="msg" class="msg"></div>
</div>

<script>
  const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
  const $ = id => document.getElementById(id);

  // Redirect if not logged in
  if (!localStorage.getItem("token")) {
    location.href = "index.html";
  }

  // File size hint
  $("attachment").addEventListener("change", () => {
    const f = $("attachment").files[0];
    $("fileNote").textContent = f
      ? `${f.name} · ${(f.size / 1024).toFixed(1)} KB`
      : "";
  });

  async function send() {
    const msg = $("msg");
    const btn = $("sendBtn");
    msg.className = "msg";

    const to = $("to").value.trim();
    const subject = $("subject").value.trim();
    const body = $("body").value;

    if (!to || !subject || !body) {
      msg.className = "msg err";
      msg.textContent = "❌ To, Subject, and Body are required.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      // Convert attachment to base64 if present
      const file = $("attachment").files[0];
      let attachment = null;
      if (file) {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let binary = "";
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        attachment = { filename: file.name, content: btoa(binary) };
      }

      const r = await fetch(FN + "?action=send", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + localStorage.getItem("token"),
        },
        body: JSON.stringify({
          to,
          cc: $("cc").value.trim(),
          bcc: $("bcc").value.trim(),
          subject,
          html: body,
          attachment,
        }),
      });

      if (r.status === 401) { localStorage.clear(); location.href = "index.html"; return; }

      const data = await r.json();

      if (r.ok && data.ok) {
        msg.className = "msg ok";
        msg.textContent = "✅ Email sent successfully!";
        // Reset form
        ["to", "cc", "bcc", "subject", "body"].forEach(id => ($(id).value = ""));
        $("attachment").value = "";
        $("fileNote").textContent = "";
      } else {
        msg.className = "msg err";
        msg.textContent = "❌ Failed: " + (data.error || JSON.stringify(data));
      }
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = "❌ " + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Send Email";
    }
  }
</script>
</body>
</html>
