<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email Details · BetterGrowth</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; margin: 0;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 900px; margin: auto; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.25rem;
  }
  a.back { color: #60a5fa; text-decoration: none; font-size: .9rem; }
  a.back:hover { text-decoration: underline; }
  .actions { display: flex; gap: .5rem; }
  .btn {
    background: #334155; border: none; color: #e2e8f0;
    padding: .5rem .9rem; border-radius: 8px; cursor: pointer;
    font-size: .85rem; text-decoration: none; display: inline-flex;
    align-items: center; gap: .4rem; transition: background .15s;
  }
  .btn:hover { background: #475569; }
  .btn.red { background: #7f1d1d; }
  .btn.red:hover { background: #991b1b; }
  .btn.blue { background: #2563eb; }
  .btn.blue:hover { background: #1d4ed8; }

  .card {
    background: #1e293b; border-radius: 14px; padding: 1.75rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    margin-bottom: 1.25rem;
  }
  .head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 1rem; margin-bottom: 1.5rem;
    border-bottom: 1px solid #334155; padding-bottom: 1rem;
  }
  .head h1 { margin: 0 0 .3rem; font-size: 1.25rem; color: #f1f5f9; }
  .head .time { color: #94a3b8; font-size: .85rem; }
  .pill {
    display: inline-block; padding: .28rem .7rem; border-radius: 999px;
    font-size: .78rem; font-weight: 700; letter-spacing: .02em;
    text-transform: uppercase;
  }
  .pill.sent   { background: #14532d; color: #bbf7d0; }
  .pill.failed { background: #7f1d1d; color: #fecaca; }

  .grid {
    display: grid;
    grid-template-columns: 110px 1fr;
    row-gap: .9rem; column-gap: 1rem;
    font-size: .92rem; align-items: start;
  }
  .label {
    color: #94a3b8; font-size: .78rem;
    text-transform: uppercase; letter-spacing: .05em;
    padding-top: .2rem;
  }
  .value { color: #e2e8f0; word-break: break-word; }
  .value.mono {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .82rem; color: #cbd5e1;
  }
  .value a { color: #60a5fa; text-decoration: none; }
  .value a:hover { text-decoration: underline; }

  h2.section {
    margin: 1.5rem 0 .8rem; font-size: 1rem; color: #f1f5f9;
    border-left: 3px solid #3b82f6; padding-left: .6rem;
  }

  .body-render {
    background: #ffffff; color: #111;
    padding: 1.25rem; border-radius: 10px;
    line-height: 1.55; font-size: .95rem;
    overflow-x: auto;
  }
  .body-render img { max-width: 100%; height: auto; }

  .body-source {
    background: #0f172a; padding: 1rem; border-radius: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .8rem; color: #cbd5e1; white-space: pre-wrap;
    max-height: 300px; overflow-y: auto;
    border: 1px solid #334155;
  }

  .attachment-box {
    background: #0f172a; padding: 1rem; border-radius: 10px;
    border: 1px solid #334155;
  }
  .attachment-head {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: .6rem; margin-bottom: .8rem;
  }
  .filename {
    color: #cbd5e1; font-size: .9rem;
    display: flex; align-items: center; gap: .4rem;
  }
  .preview-img {
    max-width: 100%; border-radius: 8px; display: block;
    border: 1px solid #334155;
  }
  .preview-pdf {
    width: 100%; height: 600px; border: 1px solid #334155;
    border-radius: 8px; background: #fff;
  }
  .no-preview {
    color: #94a3b8; font-size: .88rem;
    padding: 1.5rem; text-align: center;
    background: #0f172a; border-radius: 8px;
  }

  .loading, .error {
    text-align: center; padding: 3rem 1rem;
    color: #94a3b8; font-size: .95rem;
  }
  .error { color: #fecaca; background: #7f1d1d; border-radius: 12px; }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; row-gap: .3rem; }
    .label { padding-top: .6rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back" href="sent.html">← Back to Sent</a>
    <div class="actions">
      <button class="btn blue" onclick="resend()">↻ Resend</button>
      <button class="btn red"  onclick="del()">🗑 Delete</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">Loading email details…</div>
  </div>
</div>

<script>
  const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
  const $ = id => document.getElementById(id);

  if (!localStorage.getItem("token")) {
    location.href = "index.html";
  }

  const params = new URLSearchParams(location.search);
  const EMAIL_ID = params.get("id");

  if (!EMAIL_ID) {
    $("content").innerHTML = `<div class="error">Missing email id.</div>`;
    throw new Error("no id");
  }

  let EMAIL = null;

  /* ---------------- HTML escape ---------------- */
  function esc(s = "") {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  /* ---------------- Load ---------------- */
  async function load() {
    try {
      const r = await fetch(`${FN}?action=get&id=${encodeURIComponent(EMAIL_ID)}`, {
        headers: { Authorization: "Bearer " + localStorage.getItem("token") },
      });

      if (r.status === 401) { localStorage.clear(); location.href = "index.html"; return; }
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${r.status}`);
      }

      EMAIL = await r.json();
      render(EMAIL);
    } catch (err) {
      $("content").innerHTML = `<div class="error">❌ ${esc(err.message)}</div>`;
    }
  }

  /* ---------------- Render ---------------- */
  function render(e) {
    const statusClass = e.status === "sent" ? "sent" : "failed";
    const time = new Date(e.created_at).toLocaleString();

    // Attachment block
    let attachmentHTML = "";
    if (e.attachment_name) {
      const url = e.attachment_url || "";
      const name = esc(e.attachment_name);
      const lower = (e.attachment_name || "").toLowerCase();

      let preview = "";
      if (!url) {
        preview = `<div class="no-preview">File was not stored for this email (older send).</div>`;
      } else if (/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(lower)) {
        preview = `<img class="preview-img" src="${url}" alt="${name}" />`;
      } else if (/\.pdf$/i.test(lower)) {
        preview = `<iframe class="preview-pdf" src="${url}"></iframe>`;
      } else {
        preview = `<div class="no-preview">Preview not available for this file type.<br>
          Use the download button above.</div>`;
      }

      attachmentHTML = `
        <h2 class="section">Attachment</h2>
        <div class="attachment-box">
          <div class="attachment-head">
            <div class="filename">📎 ${name}</div>
            ${url ? `<a class="btn" href="${url}" target="_blank" download>⬇ Download</a>` : ""}
          </div>
          ${preview}
        </div>
      `;
    }

    $("content").innerHTML = `
      <div class="card">
        <div class="head">
          <div>
            <h1>${esc(e.subject || "(no subject)")}</h1>
            <div class="time">${esc(time)}</div>
          </div>
          <span class="pill ${statusClass}">${esc(e.status || "")}</span>
        </div>

        <div class="grid">
          <div class="label">From</div>
          <div class="value">HR &lt;hr@bettergrowthsolutions.com&gt;</div>

          <div class="label">To</div>
          <div class="value">${esc(e.to_email || "—")}</div>

          ${e.cc_email ? `
          <div class="label">CC</div>
          <div class="value">${esc(e.cc_email)}</div>` : ""}

          ${e.bcc_email ? `
          <div class="label">BCC</div>
          <div class="value">${esc(e.bcc_email)}</div>` : ""}

          <div class="label">Subject</div>
          <div class="value">${esc(e.subject || "—")}</div>

          ${e.resend_id ? `
          <div class="label">Resend ID</div>
          <div class="value mono">${esc(e.resend_id)}</div>` : ""}

          <div class="label">Row ID</div>
          <div class="value mono">${esc(e.id)}</div>
        </div>
      </div>

      <div class="card">
        <h2 class="section" style="margin-top:0">Body — rendered</h2>
        <div class="body-render">${e.body || ""}</div>

        <h2 class="section">Body — HTML source</h2>
        <div class="body-source">${esc(e.body || "")}</div>
      </div>

      ${attachmentHTML}
    `;
  }

  /* ---------------- Delete ---------------- */
  async function del() {
    if (!confirm("Delete this email record and its attachment?")) return;

    const r = await fetch(FN + "?action=delete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + localStorage.getItem("token"),
      },
      body: JSON.stringify({ id: EMAIL_ID }),
    });

    if (r.ok) {
      location.href = "sent.html";
    } else {
      const data = await r.json().catch(() => ({}));
      alert("Delete failed: " + (data.error || r.status));
    }
  }

  /* ---------------- Resend ---------------- */
  async function resend() {
    if (!EMAIL) return;
    if (!confirm(`Resend this email to ${EMAIL.to_email}?`)) return;

    // Build attachment payload if file exists
    let attachment = null;
    if (EMAIL.attachment_url && EMAIL.attachment_name) {
      try {
        const blobRes = await fetch(EMAIL.attachment_url);
        const blob = await blobRes.blob();
        const buf = await blob.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let binary = "";
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        attachment = {
          filename: EMAIL.attachment_name,
          content: btoa(binary),
          contentType: blob.type || "application/octet-stream",
        };
      } catch (err) {
        console.warn("Could not fetch attachment for resend:", err);
      }
    }

    const r = await fetch(FN + "?action=send", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + localStorage.getItem("token"),
      },
      body: JSON.stringify({
        to: EMAIL.to_email,
        cc: EMAIL.cc_email || "",
        bcc: EMAIL.bcc_email || "",
        subject: EMAIL.subject,
        html: EMAIL.body,
        attachment,
      }),
    });

    const data = await r.json();
    if (r.ok && data.ok) {
      alert("✅ Resent successfully");
      location.href = "sent.html";
    } else {
      alert("❌ Resend failed: " + (data.error || JSON.stringify(data)));
    }
  }

  load();
</script>
</body>
</html>
