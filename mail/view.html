<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#07162b"/>
<title>Email details · BetterGrowth Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --navy-950:#050f1f; --navy-900:#07162b; --navy-800:#0b2038; --navy-700:#143252;
    --gold:#d9a62e; --gold-deep:#b8841a; --gold-soft:#f1d899;
    --paper:#f4f5f8; --white:#fff; --ink:#0b1b30; --muted:#5a6a7f;
    --line:#dde2ea; --ok:#17653a; --ok-bg:#e3f4ea; --warn:#7a5410; --warn-bg:#fdf1d6;
    --bad:#9b1c1c; --bad-bg:#fde4e4; --info:#1d3f7a; --info-bg:#e6eefb;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100svh;
       -webkit-font-smoothing:antialiased;line-height:1.5}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  [hidden]{display:none!important}
  button{font-family:inherit}
  svg{flex:none}

  /* Top bar */
  .topbar{background:linear-gradient(90deg,var(--navy-950) 0%,var(--navy-700) 100%);color:#e9eef6;
    padding:.6rem 1.25rem;padding-top:max(.6rem,env(safe-area-inset-top));
    display:flex;align-items:center;gap:.9rem;position:sticky;top:0;z-index:40;
    border-bottom:2px solid var(--gold);box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .back{color:#e9eef6;text-decoration:none;font-size:.9rem;font-weight:500;min-height:40px;padding:0 .85rem 0 .6rem;
    border:1px solid rgba(255,255,255,.22);border-radius:10px;display:inline-flex;align-items:center;gap:.35rem;transition:background .15s}
  .back:hover{background:rgba(255,255,255,.09)}
  .brandmark{font-family:var(--serif);font-weight:700;font-size:1.25rem;color:var(--gold);display:flex;align-items:center;gap:.55rem;white-space:nowrap}
  .brandmark .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:.95rem;color:#fff}
  .spacer{flex:1}

  .wrap{max-width:900px;margin:auto;padding:1.25rem}

  /* Buttons */
  .btn{background:var(--gold);color:var(--navy-900);border:0;min-height:44px;padding:0 1.1rem;border-radius:11px;
    font-weight:600;cursor:pointer;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    text-decoration:none;white-space:nowrap;transition:background .15s,transform .08s}
  .btn:hover:not(:disabled){background:#e4b343}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover:not(:disabled){background:var(--paper)}
  .btn.red{background:var(--bad);color:#fff}
  .btn.red:hover:not(:disabled){background:#7c1515}
  .btn.blue{background:var(--info-bg);color:var(--info);border:1.5px solid #ccdbf5}
  .btn.blue:hover:not(:disabled){background:#d6e2fb}
  .actions{display:flex;gap:.5rem}
  .topbar .btn{min-height:40px;font-size:.85rem}
  .btn svg{width:17px;height:17px}

  /* Cards */
  .card{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:1.6rem;margin-bottom:1.1rem;
    box-shadow:0 6px 20px -8px rgba(11,27,48,.08)}
  .card h2{font-family:var(--serif);font-weight:700;font-size:1.25rem;margin:0 0 .8rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
  .subject-row{display:flex;gap:.8rem;align-items:flex-start;justify-content:space-between}
  .subject-row h1{font-family:var(--serif);font-weight:700;font-size:1.9rem;line-height:1.12;margin:0;overflow-wrap:anywhere}
  .time{color:var(--muted);font-size:.88rem;margin-top:.45rem;display:flex;align-items:center;gap:.4rem}
  .pill{padding:.28rem .75rem;border-radius:99px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;margin-top:.35rem;flex:none;
    display:inline-flex;align-items:center;gap:.4rem}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}

  .people{margin-top:1.1rem;border-top:1px solid var(--line);padding-top:.6rem}
  .person{display:grid;grid-template-columns:76px 1fr;gap:.2rem 1rem;padding:.5rem 0;font-size:.94rem;align-items:start}
  .person .label{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-top:.2rem}
  .person .value{overflow-wrap:anywhere}

  details.tech{margin-top:.5rem}
  details.tech summary{cursor:pointer;color:var(--muted);font-size:.8rem;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:.4rem;min-height:36px}
  details.tech summary::-webkit-details-marker{display:none}
  details.tech summary svg{transition:transform .2s}
  details.tech[open] summary svg{transform:rotate(90deg)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere;padding:.15rem 0}

  /* Message body (rendered inside a locked-down frame) */
  .frame-wrap{border:1.5px solid var(--line);border-radius:13px;background:#fff;overflow:hidden}
  .frame-wrap iframe{display:block;width:100%;border:0;height:160px;background:#fff}
  .mini{background:transparent;border:1.5px solid var(--line);color:var(--muted);min-height:38px;padding:0 .8rem;border-radius:10px;
    font-size:.8rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
  .mini:hover{background:var(--paper);color:var(--ink)}
  .source{background:var(--navy-900);padding:1.1rem;border-radius:13px;margin-top:.7rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.78rem;color:#cbd5e1;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow-y:auto;line-height:1.6}

  /* Attachment */
  .att-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.9rem}
  .filename{display:flex;align-items:center;gap:.5rem;font-weight:500;font-size:.95rem;overflow-wrap:anywhere;min-width:0}
  .filename svg{color:var(--gold-deep)}
  .att-btns{display:flex;gap:.5rem;flex-wrap:wrap}
  .preview-img{max-width:100%;height:auto;border-radius:12px;display:block;border:1.5px solid var(--line)}
  .preview-pdf{width:100%;height:600px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
  .no-preview{color:var(--muted);font-size:.92rem;padding:1.6rem 1.2rem;text-align:center;background:var(--paper);border-radius:12px;border:1.5px dashed var(--line)}

  /* States */
  .skel{border-radius:12px;background:linear-gradient(90deg,#eceff4 25%,#f6f7fa 50%,#eceff4 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .err-card{text-align:center;padding:2.4rem 1.2rem}
  .err-card svg{color:var(--bad);margin-bottom:.6rem}
  .err-card p{color:var(--bad);margin:0 0 1rem;font-weight:500}

  /* Dialog */
  .overlay{position:fixed;inset:0;background:rgba(7,22,43,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1rem;z-index:100}
  .overlay.show{display:flex}
  .dialog{background:#fff;border-radius:18px;padding:1.5rem;max-width:420px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.5);animation:pop .2s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  @keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .dialog .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-bottom:.8rem;background:var(--bad-bg);color:var(--bad)}
  .dialog.info .ico{background:var(--info-bg);color:var(--info)}
  .dialog h3{font-family:var(--serif);font-size:1.5rem;margin:0 0 .3rem}
  .dialog p{margin:0 0 1.2rem;color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
  .dialog .row{display:flex;gap:.6rem}
  .dialog .row .btn{flex:1}

  .toast-wrap{position:fixed;top:1rem;right:1rem;z-index:300;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
  .toast{background:var(--navy-800);color:#e9eef6;padding:.75rem 1rem;border-radius:11px;font-size:.88rem;border-left:4px solid var(--gold);
    box-shadow:0 10px 28px rgba(0,0,0,.3);animation:slidein .25s ease-out;max-width:340px;transition:opacity .3s}
  .toast.ok{border-left-color:#4ade80} .toast.err{border-left-color:#f87171}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

  .credit{text-align:center;color:var(--muted);font-size:.85rem;padding:.5rem 1rem 1.5rem}
  .credit a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:1px}
  .credit a:hover{color:var(--gold-deep)}

  /* Mobile */
  @media (max-width:700px){
    .topbar{padding:.55rem .9rem;padding-top:max(.55rem,env(safe-area-inset-top))}
    .brandmark .name{display:none}
    .wrap{padding:.85rem}
    .card{padding:1.1rem;border-radius:16px}
    .subject-row{flex-direction:column-reverse;gap:.4rem}
    .subject-row h1{font-size:1.6rem}
    .pill{margin-top:0}
    .person{grid-template-columns:1fr;gap:0;padding:.4rem 0}
    .preview-pdf{height:70vh}
    .att-btns{width:100%}
    .att-btns .btn{flex:1}

    /* thumb-friendly action bar */
    .actions{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:.6rem .85rem;padding-bottom:max(.6rem,env(safe-area-inset-bottom));
      background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
    .actions .btn{flex:1;min-height:48px;font-size:.95rem}
    body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}

    .overlay{align-items:flex-end;padding:0}
    .dialog{border-radius:22px 22px 0 0;padding:1.3rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));animation:sheet .25s ease-out;max-width:none}
    .toast-wrap{top:auto;bottom:calc(88px + env(safe-area-inset-bottom));left:1rem;right:1rem;align-items:center}
    .toast{max-width:none;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="sent">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    Sent
  </a>
  <div class="brandmark"><span class="mark">bg</span><span class="name">BetterGrowth Mail</span></div>
  <div class="spacer"></div>

  <div class="actions" id="actions" hidden>
    <button class="btn blue" id="resendBtn" type="button" onclick="resend()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      Resend
    </button>
    <button class="btn red" id="delBtn" type="button" onclick="askDelete()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      Delete
    </button>
  </div>
</header>

<div class="wrap">
  <div id="content" aria-live="polite">
    <div class="card">
      <div class="skel" style="height:34px;width:70%;margin-bottom:1rem"></div>
      <div class="skel" style="height:18px;width:40%;margin-bottom:1.4rem"></div>
      <div class="skel" style="height:90px"></div>
    </div>
    <div class="card"><div class="skel" style="height:160px"></div></div>
  </div>
</div>

<footer class="credit">
  Made by <a href="https://rajvardhansingh.in/" target="_blank" rel="noopener noreferrer">Rajvardhan Singh</a>
</footer>

<!-- Confirm dialog -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeDialog(false)">
  <div class="dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="ico" id="dlgIcon"></div>
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="row">
      <button class="btn ghost" type="button" id="dlgCancel" onclick="closeDialog(false)">Cancel</button>
      <button class="btn red" type="button" id="dlgOk" onclick="closeDialog(true)">Confirm</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>
const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
const ADMIN_EMAIL = "admin@bettergrowthsolutions.com";
const $ = id => document.getElementById(id);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const authHeaders = () => ({ Authorization: "Bearer " + store.get("token") });
const IS_ADMIN = (store.get("user") || "").toLowerCase() === ADMIN_EMAIL;

if (!store.get("token")) location.href = "/";

const EMAIL_ID = new URLSearchParams(location.search).get("id");
let EMAIL = null;

function esc(s = "") {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
/* Only ever allow normal web links for attachments */
function safeUrl(u) {
  try {
    const url = new URL(u, location.href);
    return (url.protocol === "https:" || url.protocol === "http:") ? url.href : "";
  } catch { return ""; }
}
function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("toastWrap").appendChild(el);
  setTimeout(() => el.style.opacity = "0", 2800);
  setTimeout(() => el.remove(), 3200);
}
function sessionExpired() {
  ["token","user","isAdmin","bg_session_id","bg_login_at","bg_captcha_ok","bg_admin_captcha_ok"].forEach(store.del);
  location.href = "/";
}

/* ───────── Confirm dialog (replaces the browser's confirm box) ───────── */
const ICONS = {
  trash:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  resend: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>'
};
let dlgResolve = null;
function ask({ title, text, ok, danger = true, icon = "trash" }) {
  $("dlgTitle").textContent = title;
  $("dlgText").textContent = text;
  $("dlgIcon").innerHTML = ICONS[icon];
  $("dialog").classList.toggle("info", !danger);
  const okBtn = $("dlgOk");
  okBtn.textContent = ok;
  okBtn.className = "btn " + (danger ? "red" : "");
  $("overlay").classList.add("show");
  $("dlgCancel").focus();
  return new Promise(res => { dlgResolve = res; });
}
function closeDialog(result) {
  $("overlay").classList.remove("show");
  if (dlgResolve) { dlgResolve(result); dlgResolve = null; }
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && dlgResolve) closeDialog(false); });

/* ───────── Load ───────── */
function showError(msg, retry) {
  $("actions").hidden = true;
  $("content").innerHTML = `
    <div class="card err-card">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
      <p>${esc(msg)}</p>
      <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap">
        ${retry ? `<button class="btn" type="button" onclick="load()">Try again</button>` : ""}
        <a class="btn ghost" href="sent">Back to Sent</a>
      </div>
    </div>`;
}

async function load() {
  if (!EMAIL_ID) { showError("This link is missing an email ID.", false); return; }
  try {
    const r = await fetch(`${FN}?action=get&id=${encodeURIComponent(EMAIL_ID)}`, { headers: authHeaders() });
    if (r.status === 401) return sessionExpired();
    const data = await r.json().catch(() => ({}));
    if (!r.ok || data.error) { showError(data.error || "Could not load this email (HTTP " + r.status + ").", false); return; }
    EMAIL = data;
    render(EMAIL);
  } catch (err) {
    showError(err.message === "Failed to fetch" ? "Can't reach the server. Check your connection." : err.message, true);
  }
}

function statusClass(s = "") {
  s = String(s).toLowerCase();
  return s === "sent" ? "ok" : /fail|error|bounce|reject/.test(s) ? "bad" : "warn";
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const looksLikeHtml = s => /<\/?[a-z][\s\S]*>/i.test(s);

function render(e) {
  const time = isNaN(new Date(e.created_at)) ? "—" : new Date(e.created_at).toLocaleString(undefined, { dateStyle: "full", timeStyle: "short" });
  const sc = statusClass(e.status);
  const sender = e.from_email || e.sender_email;
  const fromHtml = sender ? esc(sender) : "HR &lt;hr@bettergrowthsolutions.com&gt;";
  document.title = (e.subject || "(no subject)") + " · BetterGrowth Mail";

  /* Attachment */
  let attachment = "";
  if (e.attachment_name) {
    const url = safeUrl(e.attachment_url || "");
    const name = esc(e.attachment_name);
    let preview;
    if (!e.attachment_url) {
      preview = `<div class="no-preview">File not stored for this email (sent before storage was enabled).</div>`;
    } else if (!url) {
      preview = `<div class="no-preview">This attachment link can't be opened safely.</div>`;
    } else if (/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(e.attachment_name)) {
      preview = `<img class="preview-img" src="${esc(url)}" alt="${name}" loading="lazy"/>`;
    } else if (/\.pdf$/i.test(e.attachment_name)) {
      preview = `<iframe class="preview-pdf" src="${esc(url)}" title="${name}"></iframe>`;
    } else {
      preview = `<div class="no-preview">Preview isn't available for this file type. Use Download.</div>`;
    }
    attachment = `
      <section class="card">
        <h2>Attachment</h2>
        <div class="att-head">
          <div class="filename">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
            <span>${name}</span>
          </div>
          ${url ? `<div class="att-btns">
            <a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open</a>
            <a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer" download>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>Download</a>
          </div>` : ""}
        </div>
        ${preview}
      </section>`;
  }

  $("content").innerHTML = `
    <section class="card">
      <div class="subject-row">
        <div>
          <h1>${esc(e.subject || "(no subject)")}</h1>
          <div class="time">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            ${esc(time)}
          </div>
        </div>
        <span class="pill ${sc}">${esc(cap(String(e.status || "unknown")))}</span>
      </div>

      <div class="people">
        <div class="person"><div class="label">From</div><div class="value">${fromHtml}</div></div>
        <div class="person"><div class="label">To</div><div class="value">${esc(e.to_email || "—")}</div></div>
        ${e.cc_email  ? `<div class="person"><div class="label">CC</div><div class="value">${esc(e.cc_email)}</div></div>` : ""}
        ${e.bcc_email ? `<div class="person"><div class="label">BCC</div><div class="value">${esc(e.bcc_email)}</div></div>` : ""}
      </div>

      <details class="tech">
        <summary><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>Technical details</summary>
        ${e.resend_id ? `<div class="mono">Resend ID: ${esc(e.resend_id)}</div>` : ""}
        <div class="mono">Row ID: ${esc(e.id)}</div>
      </details>
    </section>

    <section class="card">
      <h2>Message
        <button class="mini" id="srcBtn" type="button" aria-expanded="false">View HTML source</button>
      </h2>
      <div class="frame-wrap" id="frameWrap"></div>
      <pre class="source" id="source" hidden></pre>
    </section>

    ${attachment}`;

  mountBody(e.body || "");
  $("source").textContent = e.body || "";
  $("srcBtn").addEventListener("click", () => {
    const open = $("source").hidden;
    $("source").hidden = !open;
    $("srcBtn").setAttribute("aria-expanded", String(open));
    $("srcBtn").textContent = open ? "Hide HTML source" : "View HTML source";
  });
  $("actions").hidden = false;
}

/* The email body is untrusted HTML. It is shown inside a sandboxed frame with scripts
   switched off, so nothing inside it can run or reach your login. */
function mountBody(body) {
  const frame = document.createElement("iframe");
  frame.title = "Email message";
  frame.setAttribute("sandbox", "allow-same-origin allow-popups allow-popups-to-escape-sandbox"); // no allow-scripts
  frame.referrerPolicy = "no-referrer";
  const inner = !body.trim()
    ? '<p style="color:#5a6a7f;font-style:italic">This email has no message.</p>'
    : looksLikeHtml(body) ? body : '<div style="white-space:pre-wrap">' + esc(body) + "</div>";
  frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><base target="_blank">
    <style>html,body{margin:0}body{display:flow-root;padding:1.1rem 1.2rem;font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0b1b30;overflow-wrap:anywhere}
    img{max-width:100%;height:auto}table{max-width:100%}pre{white-space:pre-wrap}a{color:#1d3f7a}</style></head><body>${inner}</body></html>`;
  frame.addEventListener("load", () => {
    const d = frame.contentDocument;
    if (!d || !d.body) return;
    const fit = () => { frame.style.height = Math.max(100, Math.ceil(d.body.getBoundingClientRect().height)) + "px"; };
    fit();
    try { new ResizeObserver(fit).observe(d.body); } catch {}
    d.querySelectorAll("img").forEach(i => i.addEventListener("load", fit));
  });
  $("frameWrap").appendChild(frame);
}

/* ───────── Actions ───────── */
function busy(on, which) {
  $("resendBtn").disabled = on;
  $("delBtn").disabled = on;
  if (which === "resend") $("resendBtn").lastChild.textContent = on ? " Resending…" : " Resend";
  if (which === "delete") $("delBtn").lastChild.textContent = on ? " Deleting…" : " Delete";
}

async function askDelete() {
  if (!EMAIL) return;
  const yes = await ask({
    title: "Delete this email?",
    text: "The record and its attachment will be removed permanently. This can't be undone.",
    ok: "Delete"
  });
  if (!yes) return;
  busy(true, "delete");
  try {
    const r = await fetch(FN + "?action=delete", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify({ id: EMAIL_ID })
    });
    if (r.status === 401) return sessionExpired();
    if (r.ok) { location.href = "sent"; return; }
    const d = await r.json().catch(() => ({}));
    toast("Delete failed: " + (d.error || r.status), "err");
  } catch {
    toast("Delete failed. Check your connection.", "err");
  }
  busy(false, "delete");
}

async function resend() {
  if (!EMAIL) return;
  const yes = await ask({
    title: "Resend this email?",
    text: `A new copy will be sent to ${EMAIL.to_email || "the same recipient"}${EMAIL.attachment_name ? ", with its attachment" : ""}.`,
    ok: "Resend", danger: false, icon: "resend"
  });
  if (!yes) return;
  busy(true, "resend");

  try {
    let attachment = null;
    const aurl = safeUrl(EMAIL.attachment_url || "");
    if (aurl && EMAIL.attachment_name) {
      try {
        const blob = await (await fetch(aurl)).blob();
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let binary = "";
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        attachment = { filename: EMAIL.attachment_name, content: btoa(binary), contentType: blob.type || "application/octet-stream" };
      } catch (err) {
        console.warn("attachment fetch failed:", err);
        const goOn = await ask({
          title: "Attachment couldn't be loaded",
          text: "Send the email without its attachment?",
          ok: "Send without it", danger: false, icon: "resend"
        });
        if (!goOn) { busy(false, "resend"); return; }
      }
    }

    const payload = {
      to: EMAIL.to_email, cc: EMAIL.cc_email || "", bcc: EMAIL.bcc_email || "",
      subject: EMAIL.subject, html: EMAIL.body, attachment
    };
    const from = EMAIL.from_email || EMAIL.sender_email;
    if (IS_ADMIN && from) payload.from = from;   // the admin panel can choose the sending account

    const r = await fetch(FN + "?action=send", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify(payload)
    });
    if (r.status === 401) return sessionExpired();
    const data = await r.json().catch(() => ({}));
    if (r.ok && data.ok) {
      toast("Email resent", "ok");
      setTimeout(() => { location.href = "sent"; }, 900);
      return;
    }
    toast("Resend failed: " + (data.error || r.status), "err");
  } catch (err) {
    toast("Resend failed: " + (err.message === "Failed to fetch" ? "check your connection" : err.message), "err");
  }
  busy(false, "resend");
}

load();
</script>
