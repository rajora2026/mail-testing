<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#07162b"/>
<title>Sign in · BetterGrowth Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --navy-900:#07162b; --navy-800:#0b2038; --navy-700:#143252;
    --gold:#d9a62e; --gold-deep:#b8841a; --gold-soft:#f1d899;
    --paper:#f5f6f8; --white:#fff; --ink:#0b1b30; --muted:#5a6a7f;
    --line:#dde2ea; --bad:#9b1c1c; --bad-bg:#fde4e4;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--navy-900);
       min-height:100svh;line-height:1.5;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .shell{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100svh}

  /* brand */
  .brand{position:relative;overflow:hidden;color:#fff;
    background:radial-gradient(120% 90% at 0% 0%,#0e2a4a 0%,rgba(14,42,74,0) 55%),var(--navy-800);
    padding:clamp(24px,5vw,64px);display:flex;flex-direction:column}
  .logo{display:block;width:min(300px,64%);height:auto;mix-blend-mode:lighten}
  .brand-copy{position:relative;z-index:2;max-width:30rem;margin:clamp(32px,10vh,100px) 0 0}
  .brand-copy h1{font-family:var(--serif);font-weight:600;
    font-size:clamp(2rem,4.2vw,3.6rem);line-height:1.05;
    letter-spacing:-.01em;margin:0 0 .9rem}
  .brand-copy p{margin:0;color:#b8c4d6;font-size:1rem;max-width:26rem}
  .growth{position:absolute;left:0;right:0;bottom:0;width:100%;height:56%;z-index:1;pointer-events:none}
  .growth .line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .3s cubic-bezier(.65,0,.25,1) forwards}
  .growth .ghost{fill:none;stroke:rgba(255,255,255,.09);stroke-width:1.5}
  .growth .tip{fill:var(--gold);opacity:0;animation:pop .5s 2.5s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{opacity:1}}

  /* panel */
  .panel{background:var(--paper);display:flex;flex-direction:column;
    padding:clamp(22px,5vw,60px);
    padding-top:max(clamp(22px,5vw,60px),env(safe-area-inset-top));
    padding-bottom:max(22px,env(safe-area-inset-bottom))}
  .panel-main{flex:1;display:flex;align-items:center;justify-content:center}
  .box{width:100%;max-width:400px}
  .box h2{font-family:var(--serif);font-weight:700;
    font-size:clamp(1.8rem,4vw,2.3rem);margin:0 0 .35rem;letter-spacing:-.01em}
  .lead{margin:0 0 1.5rem;color:var(--muted);font-size:.95rem}
  [hidden]{display:none!important}

  .field{margin-bottom:1rem}
  label{display:block;font-size:.85rem;font-weight:500;margin-bottom:.35rem}
  .control{position:relative}
  input{width:100%;height:50px;padding:0 1rem;font:inherit;font-size:1rem;
    color:var(--ink);background:var(--white);border:1.5px solid var(--line);
    border-radius:10px;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:#9aa6b5}
  input:hover{border-color:#c3cbd7}
  input:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 4px rgba(217,166,46,.28)}
  input[aria-invalid="true"]{border-color:#c0392b}
  .control input.has-toggle{padding-right:3.4rem}
  .toggle{position:absolute;top:50%;right:6px;transform:translateY(-50%);
    width:40px;height:40px;border:0;border-radius:8px;background:transparent;
    color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .toggle:hover{background:#eef1f5;color:var(--ink)}

  /* captcha row */
  .captcha-row{
    display:grid; grid-template-columns:1fr auto; gap:.6rem;
    align-items:stretch;
  }
  .captcha-code{
    background:var(--navy-800); color:var(--gold);
    padding:.75rem 1rem; border-radius:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:1.6rem; font-weight:700; letter-spacing:.35em;
    display:flex; align-items:center; justify-content:center;
    user-select:none; border:2px dashed rgba(217,166,46,.4);
    position:relative; overflow:hidden;
  }
  .captcha-code::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(45deg,rgba(217,166,46,.1) 0 5px,transparent 5px 10px),
      repeating-linear-gradient(-45deg,rgba(217,166,46,.06) 0 4px,transparent 4px 9px);
  }
  .captcha-refresh{
    background:var(--white); border:1.5px solid var(--line);
    border-radius:10px; color:var(--muted); cursor:pointer;
    width:50px; display:grid; place-items:center; font-size:1.1rem;
    transition:background .15s, color .15s;
  }
  .captcha-refresh:hover{background:var(--paper); color:var(--ink)}
  .captcha-input{
    width:100%; text-align:center; letter-spacing:.4em;
    font-size:1.25rem; font-weight:700;
  }
  .captcha-input.shake{animation:shake .35s}
  @keyframes shake{
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  .btn{width:100%;height:52px;border:0;border-radius:10px;font:inherit;
    font-weight:600;font-size:1rem;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;gap:.6rem;
    transition:background .15s,transform .08s}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn-primary{background:var(--gold);color:var(--navy-900);margin-top:.6rem}
  .btn-primary:hover:not(:disabled){background:#e4b343}
  .btn-primary:disabled{background:#e6dcc3;color:#7d7358;cursor:not-allowed}

  .spinner{width:18px;height:18px;border-radius:50%;
    border:2.5px solid rgba(7,22,43,.25);border-top-color:var(--navy-900);
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .error{display:flex;gap:.6rem;align-items:flex-start;margin-top:.9rem;
    padding:.7rem .85rem;background:var(--bad-bg);color:var(--bad);
    border-radius:10px;font-size:.9rem}
  .error svg{flex:none;margin-top:2px}

  .credit{text-align:center;color:var(--muted);font-size:.85rem;padding-top:1.25rem}
  .credit a{color:var(--ink);font-weight:600;text-decoration:none;
    border-bottom:2px solid var(--gold);padding-bottom:1px}
  .credit a:hover{color:var(--gold-deep)}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    .brand{padding:18px 20px 22px;min-height:auto;
      background:radial-gradient(150% 120% at 100% 0%,#0e2a4a 0%,rgba(14,42,74,0) 60%),var(--navy-800)}
    .logo{width:min(200px,55%);margin:0 auto}
    .brand-copy{display:none}
    .growth{height:100%;opacity:.5}
    .panel{border-radius:22px 22px 0 0;margin-top:-10px;position:relative;z-index:3;
      padding:26px 20px;padding-bottom:max(26px,env(safe-area-inset-bottom));min-height:auto}
    .panel-main{align-items:flex-start;padding-top:.25rem}
    .box{max-width:100%}
    .box h2{font-size:1.9rem}
    input{height:52px;font-size:1rem}
    .btn{height:54px}
    .credit{padding-top:1rem;font-size:.8rem}
  }
  @media (prefers-reduced-motion:reduce){
    .growth .line{animation:none;stroke-dashoffset:0}
    .growth .tip{animation:none;opacity:1}
    .spinner{animation:none}
    .btn{transition:none}
    .captcha-input.shake{animation:none}
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="brand">
    <img class="logo" alt="BetterGrowth Solutions"
      src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 80'><text x='0' y='52' font-family='Georgia,serif' font-size='42' font-weight='700' fill='%23d9a62e'>BetterGrowth</text><text x='2' y='72' font-family='system-ui,sans-serif' font-size='13' fill='%23b8c4d6' letter-spacing='4'>SOLUTIONS</text></svg>"/>

    <div class="brand-copy">
      <h1>Send it once. Track it every step.</h1>
      <p>Write company emails, check what was delivered, and review your sent history from one place.</p>
    </div>

    <svg class="growth" viewBox="0 0 800 400" preserveAspectRatio="none" aria-hidden="true">
      <path class="ghost" d="M0 330 C 160 320, 260 300, 380 250 S 600 150, 800 70"/>
      <path class="ghost" d="M0 370 C 200 360, 300 340, 420 300 S 640 220, 800 150"/>
      <path class="line" pathLength="1" d="M0 350 C 150 340, 250 330, 360 280 S 580 140, 770 50"/>
      <path class="tip" d="M792 38 L762 40 L772 64 Z"/>
    </svg>
  </aside>

  <main class="panel">
    <div class="panel-main">
      <div class="box">
        <h2 id="loginTitle">Sign in</h2>
        <p class="lead">Enter your email, password, and the 4-digit code.</p>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" inputmode="email" autocomplete="username"
                   placeholder="hr@bettergrowthsolutions.com" required/>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="control">
              <input id="password" class="has-toggle" type="password"
                     autocomplete="current-password" placeholder="Enter your password" required/>
              <button type="button" class="toggle" id="togglePw"
                      aria-label="Show password" aria-pressed="false">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- CAPTCHA -->
          <div class="field">
            <label for="captchaInput">Verification code</label>
            <div class="captcha-row">
              <div class="captcha-code" id="captchaCode" aria-hidden="true">0000</div>
              <button type="button" class="captcha-refresh" id="captchaRefresh"
                      title="New code" aria-label="Generate new code">↻</button>
            </div>
            <input id="captchaInput" class="captcha-input" type="text"
                   inputmode="numeric" maxlength="4" autocomplete="off"
                   placeholder="Enter 4 digits" style="margin-top:.5rem" required/>
          </div>

          <div id="loginError" class="error" role="alert" aria-live="assertive" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>
            </svg>
            <span id="loginErrorText"></span>
          </div>

          <button id="loginBtn" class="btn btn-primary" type="submit">Sign in</button>
        </form>
      </div>
    </div>

    <footer class="credit">
      Made by <a href="https://rajvardhansingh.in/" target="_blank" rel="noopener noreferrer">Rajvardhan Singh</a>
    </footer>
  </main>
</div>

<script>
const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
const $  = id => document.getElementById(id);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

/* ---------- Captcha ---------- */
let CAPTCHA_CODE = "";

function newCaptcha() {
  CAPTCHA_CODE = String(Math.floor(1000 + Math.random() * 9000));
  $("captchaCode").textContent = CAPTCHA_CODE;
  $("captchaInput").value = "";
  $("captchaInput").classList.remove("shake");
}
$("captchaRefresh").addEventListener("click", newCaptcha);
$("captchaInput").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
  hideError();
});

/* ---------- UI ---------- */
function showError(msg) {
  $("loginErrorText").textContent = msg;
  $("loginError").hidden = false;
}
function hideError() { $("loginError").hidden = true; }

function setBusy(busy) {
  const btn = $("loginBtn");
  btn.disabled = busy;
  btn.innerHTML = busy
    ? '<span class="spinner" aria-hidden="true"></span> Signing in…'
    : 'Sign in';
}

/* ---------- Login ---------- */
async function login(e) {
  if (e) e.preventDefault();
  hideError();

  const email    = $("email").value.trim();
  const password = $("password").value;
  const captcha  = $("captchaInput").value.trim();

  $("email").removeAttribute("aria-invalid");
  $("password").removeAttribute("aria-invalid");

  if (!email) {
    $("email").setAttribute("aria-invalid","true");
    $("email").focus();
    return showError("Enter your email address.");
  }
  if (!password) {
    $("password").setAttribute("aria-invalid","true");
    $("password").focus();
    return showError("Enter your password.");
  }
  if (captcha.length !== 4) {
    $("captchaInput").focus();
    return showError("Enter the 4-digit verification code.");
  }
  if (captcha !== CAPTCHA_CODE) {
    $("captchaInput").classList.add("shake");
    $("captchaInput").focus();
    newCaptcha();
    return showError("Verification code is incorrect. Try the new one.");
  }

  setBusy(true);

  try {
    const r = await fetch(FN + "?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await r.json().catch(() => ({}));

    if (!r.ok || !data.ok) {
      newCaptcha();     // require fresh captcha on any failed attempt
      throw new Error(data.error || "Email or password is incorrect.");
    }

    /* success */
    store.set("token", data.access_token);
    store.set("user",  data.user?.email || email);
    store.set("bg_captcha_ok", "1");   // mark captcha as passed for this session

    setTimeout(() => { location.href = "dashboard"; }, 150);

  } catch (err) {
    const msg = err.message === "Failed to fetch"
      ? "Can't reach the server. Check your connection and try again."
      : err.message;
    showError(msg);
    setBusy(false);
  }
}

/* ---------- Password toggle ---------- */
$("togglePw").addEventListener("click", () => {
  const pw = $("password");
  const show = pw.type === "password";
  pw.type = show ? "text" : "password";
  $("togglePw").setAttribute("aria-pressed", String(show));
  $("togglePw").setAttribute("aria-label", show ? "Hide password" : "Show password");
  $("eyeIcon").innerHTML = show
    ? '<path d="M3 3l18 18"/><path d="M10.6 6.1A10.7 10.7 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9"/><path d="M6.6 6.7A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
    : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
});

/* ---------- Wire + boot ---------- */
$("loginForm").addEventListener("submit", login);
newCaptcha();

if (store.get("token") && store.get("bg_captcha_ok") === "1") {
  location.href = "dashboard";
}
</script>
</body>
</html>
