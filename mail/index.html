<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BetterGrowth · Mail</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:#0f172a;color:#e2e8f0;display:flex;align-items:center;
       justify-content:center;min-height:100vh;margin:0;padding:1rem}
  .card{background:#1e293b;padding:2rem;border-radius:14px;width:100%;
        max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  h1{margin:0 0 1.25rem;font-size:1.3rem}
  h1 span{color:#60a5fa}
  label{display:block;font-size:.82rem;color:#94a3b8;margin-top:.75rem}
  input,button{width:100%;padding:.75rem;margin-top:.3rem;border-radius:8px;
    border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.95rem}
  input:focus{outline:none;border-color:#3b82f6}
  button{background:#3b82f6;border:none;cursor:pointer;font-weight:600;
         margin-top:1rem;transition:background .15s}
  button:hover{background:#2563eb}
  button:disabled{background:#475569;cursor:not-allowed}
  button.secondary{background:#475569}
  button.secondary:hover{background:#334155}
  .row{display:flex;gap:.6rem;margin-top:1rem}
  .row a{flex:1;text-align:center;padding:.7rem;border-radius:8px;
         background:#334155;color:#e2e8f0;text-decoration:none;
         font-size:.9rem;font-weight:500}
  .row a:hover{background:#475569}
  .summary{margin-top:1.25rem;padding:.9rem 1rem;background:#0f172a;
           border-radius:8px;font-size:.85rem;line-height:1.6;
           border-left:3px solid #3b82f6}
  .summary b{color:#60a5fa;display:block;margin-bottom:.35rem}
  .summary a{color:#60a5fa;text-decoration:none;display:inline-block;margin-top:.5rem}
  .summary a:hover{text-decoration:underline}
  .muted{color:#64748b}
  .user-bar{display:flex;justify-content:space-between;align-items:center;
            padding-bottom:.75rem;border-bottom:1px solid #334155;
            margin-bottom:.5rem;font-size:.85rem}
  .user-bar b{color:#60a5fa}
  .error{background:#7f1d1d;color:#fecaca;padding:.6rem .8rem;
         border-radius:6px;font-size:.85rem;margin-top:.8rem}
</style>
</head>
<body>
<div class="card">
  <h1>BetterGrowth <span>Mail</span></h1>

  <div id="loginBox">
    <label>Email</label>
    <input id="email" type="email" placeholder="hr@bettergrowthsolutions.com"/>
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••"/>
    <button id="loginBtn" onclick="login()">Login</button>
    <div id="loginError" class="error" style="display:none"></div>
  </div>

  <div id="appBox" style="display:none">
    <div class="user-bar"><span>Signed in as <b id="userEmail"></b></span></div>
    <div class="row">
      <a href="send">✉️ Send Email</a>
      <a href="sent">📬 Sent</a>
    </div>
    <div class="summary" id="summary">Loading…</div>
    <button class="secondary" onclick="logout()">Logout</button>
  </div>
</div>

<script>
const FN = "https://cztelemfiqovsoizrohr.supabase.co/functions/v1/send-email";
const $ = id => document.getElementById(id);

function esc(s = "") {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function login() {
  const btn = $("loginBtn"), errBox = $("loginError");
  errBox.style.display = "none";
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) return showError("Enter email and password");

  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const r = await fetch(FN + "?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || "Invalid login");

    localStorage.setItem("token", data.access_token);
    localStorage.setItem("user", data.user.email);
    await showApp();
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Login";
  }
}

function showError(msg) {
  const box = $("loginError");
  box.textContent = "❌ " + msg;
  box.style.display = "block";
}

function logout() { localStorage.clear(); location.reload(); }

async function showApp() {
  $("loginBox").style.display = "none";
  $("appBox").style.display = "block";
  $("userEmail").textContent = localStorage.getItem("user") || "";

  const box = $("summary");
  box.innerHTML = "Loading…";

  try {
    const r = await fetch(FN + "?action=last", {
      headers: { Authorization: "Bearer " + localStorage.getItem("token") },
    });
    if (r.status === 401) return logout();
    const last = await r.json();

    box.innerHTML = last && last.subject
      ? `<b>Last email sent</b>
         To: ${esc(last.to_email)}<br>
         Subject: ${esc(last.subject)}<br>
         Status: ${esc(last.status)}<br>
         Time: ${new Date(last.created_at).toLocaleString()}
         <a href="view?id=${encodeURIComponent(last.id)}">View full details →</a>`
      : `<b>Last email sent</b><span class="muted">No emails sent yet.</span>`;
  } catch {
    box.innerHTML = `<b>Last email sent</b><span class="muted">Unable to load.</span>`;
  }
}

if (localStorage.getItem("token")) showApp();
</script>
</body>
</html>
